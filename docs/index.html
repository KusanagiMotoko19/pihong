三四，从不含糊。`,`他算过一笔账：若把天下驿递裁去三成，一年可省银四十万。说完他自己补了一句：「不过这样要得罪很多人。」`]),k(`xuguo`,`许国`,`维桢`,`南直隶歙县`,`嘉靖四十四年进士`,1527,`grand-4`,`清流`,69,73,72,73,76,70,`歙县人。由翰林历詹事府詹事。刚直敢言，不避权贵，士林重之。`,`操守端方，敢任事。然性刚，不能容人。`,[`他进门时行的是常礼，不是大礼。你问他为什么，他说「臣是来议事的，不是来行礼的」。`,`谈到辽东，他直言「李成梁之功，半是报的」。说完也不看你。`]),k(`wangguanguang`,`王国光`,`汝观`,`山西阳城`,`嘉靖二十三年进士`,1512,`hubu-shangshu`,`江陵旧人`,62,84,82,84,58,68,`起家知县，历户部郎中、顺天府尹、户部尚书。在户部九年，天下钱粮出入皆能口诵，张居正倚之如左右手。为人峻急，好察。`,`综核精敏，钱谷第一。然性苛急，属吏苦之。`,[`奏对时条理极清，钱粮数目信口道来，无一处滞碍。这是个真会算账的人。`,`谈起清丈，他先说「各省有司苦之」，再说「然非此无以核田」。先把难处摆出来，是给自己留后路。`,`问户部现存银数，他答「三百七十余万」。答得太快了。`]),k(`liangmenglong`,`梁梦龙`,`乾吉`,`北直隶真定`,`嘉靖三十二年进士`,1527,`bingbu-shangshu`,`晋党`,63,75,72,74,62,66,`真定人。历顺天府尹、右副都御史巡抚山东、蓟辽总督、兵部尚书。谙熟边务，尤精海运。`,`明习边事，敢任劳怨。然与晋党相厚，其进不由正。`,[`谈边务如数家珍，哪一镇缺马多少，哪一处墙台该修，一一道来。`,`他提过海运。说「漕河一断，京师就饿死」。这话不吉利，但没人能驳他。`]),k(`shenli`,`沈鲤`,`仲化`,`河南归德`,`嘉靖四十四年进士`,1531,`libu2-shangshu`,`清流`,76,78,72,75,86,80,`归德人。由翰林历礼部侍郎、礼部尚书。学行醇正，为士林所宗，时称「归德沈公」。`,`学行兼备，操守甚严。可为师儒，未可当大任。`,[`他讲学不讲政。你问他国用，他说「国用不足，先在节用」。`,`临走时他说：「皇上，臣有一言。天下的事，坏在人人只说好。」`]),k(`hairui`,`海瑞`,`汝贤`,`广东琼山`,`嘉靖二十八年举人`,1514,`ducha-zuo`,`清流`,96,45,85,52,99,88,`琼山人。由南平教谕历淳安知县、户部主事、应天巡抚。上《治安疏》几死。刚峰之名，天下皆知。`,`清介绝俗，刚直不阿。然迂执不通时变，不可为政务之官。`,[`七十岁了，说话还是那个样子：一句是一句，不留余地。`,`他说「天下的官，十之八九是该杀的」。你问他那十之一二呢，他说「臣不知道」。`,`他不肯坐轿，是走来的。走了半个时辰。`]),k(`zhaonaxing`,`赵南星`,`梦白`,`北直隶高邑`,`万历二年进士`,1550,`ducha-fu`,`清流`,86,78,82,76,88,82,`高邑人。由汝宁推官历吏部考功郎中。慨然以澄清天下为己任，东林之魁。`,`风节峻厉，嫉恶如仇。然锋芒太露，树敌太多。`,[`他谈吏治，不绕弯子：「今日之弊，在一个『私』字。」`,`你问他谁能用，他报了七个名字。七个里，五个是他的同乡。他自己没觉得不妥。`]),k(`guxiancheng`,`顾宪成`,`叔时`,`南直隶无锡`,`万历八年进士`,1550,`guozijian-siye`,`清流`,70,74,72,73,83,76,`无锡人。万历八年进士，授户部主事。好议论，敢言事，后讲学东林，为天下士所归。`,`学有本源，议论明快。然好名，喜结党。`,[`他讲「君子小人」讲了很久。你打断他，问「那你是君子还是小人」，他愣了一下，说「臣不敢自居」。`]),k(`wangxijue`,`王锡爵`,`元驭`,`南直隶太仓`,`嘉靖四十一年进士`,1534,`libu2-zuo`,`浙党`,65,75,68,72,70,70,`太仓人。会试第一，廷试第二。历翰林、国子监祭酒、詹事府。性强直，敢与上争。`,`才气骏发，敢言敢任。然刚愎，好胜。`,[`他一开口就是「臣以为不可」。你还没说完。`,`谈到国本，他看了你一眼，没说话。这个话题，现在还不到时候。`]),k(`yushenxing`,`于慎行`,`可远`,`山东东阿`,`隆庆二年进士`,1545,`hanlin-zhang`,`无党`,73,78,69,74,80,74,`东阿人。由翰林历修撰、侍讲学士。学博而醇，长于典礼，所著《谷山笔麈》为世所重。` index):t).trim();if(i.includes(` `)){let[e,t]=i.split(/\s+/);if(t&&t.length>=2)return{text:`${e} ${t}${r?` `+r:``}`}}let a=i;for(let[t,n]of ct)if(a.includes(t)){let t=at(e.inner,n);if(t)return{text:`${a} ${t.name}${r?` `+r:``}`}}if(a.includes(`御史`)){let t=lt(e);if(t)return{text:`${a} ${t.name}${r?` `+r:``}`,id:t.id}}let o=ot[a];if(o){let t=e.officers.find(e=>e.officeId===o);if(t)return{text:`${E.get(o)?.name??a} ${t.name}${r?` `+r:``}`,id:t.id}}for(let[t,n]of st)if(a.includes(t)){let t=e.officers.find(e=>e.officeId===n);if(t)return{text:`${E.get(n)?.name??a} ${t.name}${r?` `+r:``}`,id:t.id}}if(a.endsWith(`总督`)||a.endsWith(`巡抚`)){let t=e.officers.find(e=>e.officeId&&e.jinshi&&(e.tenure??0)>=0);if(t)return{text:`${a}署事 ${t.name}`,id:t.id}}return{text:t}}var dt={"qz-open":`万历八年下诏清丈天下田亩。起因是张居正查户部旧账，发现洪武年间的田额比现在多三成——那三成不是飞了，是被人隐占了。两年下来，各省报册陆续到部，到今年六月，账面上算过了八成。`,"qz-secret":`这本没有经过通政司，是巡按御史用密封匣直送宫门的。走这条路，写本的人不图升官，也不怕得罪人——所以他写的可能比内阁那些票拟可信。`,"qz-reset":`覆核的令下去三个月，动了真格。徽州、宁国两府的田册被翻出来重造，触到的是当地最大的几家。`,"qz-ask":`王国光在户部九年，清丈是他一手办的。报上去的数与实数差了四成，他比谁都清楚。`,"qz-routine":`清丈是万历八年起的差事，两年多了。各省报册按旬递到户部，户部按旬往上报一个数。`,"qz-m30":`清丈过了三成，头一批隐占的田浮出水面——浮出来的第一批，是藩府的庄田。襄王的庄田在河南、湖广两处，册子上记的是「钦赐」，实际丈下来，多出三倍。`,"qz-m55":`清丈过半，苏松常镇四府的乡绅坐不住了。这四府是全国赋税最重的地方，也是田产最集中的地方。`,"qz-m90":`各省报竣，田册堆在户部。按例该遣官抽验，可验一回要一年、要八万两。户部想直接奏销。`,"fb-impeach":`冯保掌司礼监十年，批红的笔一直在他手里。张居正活着的时候，两个人是一体的：外廷的票拟出自张居正，内廷的朱批出自冯保。如今张居正死了半年，冯保一个人站着。`,"fb-panic":`冯保籍家之后，内廷十二监四司八局，称病告假的三十多人。他们不是冯保的党，是怕。`,"fb-plot":`东厂报上来一份名单：冯保到南京之后，还有七个人给他递过信。其中有一个，是张四维的门生。`,"kc-debate":`考成法是万历元年颁的：每件事立程限，三本账簿层层查考，征赋不足九成者罚。十年下来，政令「虽万里之外，朝下而夕奉行」——代价是州县官不敢报灾。张居正一死，朝中要求宽考的声浪就起来了。`,"kc-loose":`宽考的诏下去三个月。州县不必再怕降级，催科的劲就松了——松的是催科，紧的是国库。`,"kc-harsh":`考成照旧，征赋不足九成一律降三级。这条规矩在万历四年定下时，没人觉得会出人命。`,"settle-zhang":`张居正死后半年，弹劾的奏本一天比一天多。先是说他「夺情起复、忘亲贪位」，再是说他「结党营私、压制言路」。这些话都不新鲜——真正要命的是另一句：他家在江陵，田产万顷。清算一个权臣，从「擅权」入手难，从「赃私」入手容易。`,"y11-impeach":`张居正死后半年，弹劾的奏本一天比一天多。先说他「夺情起复、忘亲贪位」，再说他「结党营私、压制言路」。这些话都不新鲜——真正要命的是另一句：他诬蔑辽王，夺了人家的府第。清算一个权臣，从「擅权」入手难，从「欺宗室」入手容易。`,"y11-raid-home":`籍没的旨意是六月下的。荆州知府带人封了张府的门，不许人出入，等着京里派的官来点验。这一等，等了两个多月。`,"y11-jianzhou":`建州左卫在辽东边外，自永乐年间设卫，世袭都指挥使。努尔哈赤的祖、父都做过官军的向导，死于兵。他今年二十五岁。辽东报上来说「不过一部酋耳」——这话往年也说过，说过王杲，说过王台。`,"y11-kaocha":`六年京察，例在辰戌丑未年。今年辛未，正届期。上一次京察是万历五年，那时候张居正当国，去留全凭他一句话。如今他死了，这一届由谁来定人去留，是朝中眼下最要紧的一件事。`,"y11-river":`潘季驯治河三年，高家堰是全部工程的关键：堤成则淮水不出，淮不出则黄不倒灌，运道可保。堤已筑了九分。他知道户部不肯给钱——前年他上疏要帑，被驳回过一次。`,"y12-hairui":`海瑞闲居了十三年。张居正当国时，最忌的就是这种「清名满天下、又不肯低头」的人，几次有人荐他，都压着不用。如今张居正死了两年，荐牍上又有他的名字。`,"y12-salt":`两淮盐课是天下盐课之半，可这半已壅了十年。引照样在发，盐照样在私卖，只有边镇的粮仓一年比一年空。占着引窝的，是几家开国勋贵的后人。`,"y12-altan":`隆庆五年封俺答为顺义王，开马市，宣大从此无边警十三年。如今俺答老了，部里的事是他妻子三娘子在管。她要名分，也要实惠。`,"y13-drought":`京畿自二月不雨。三月的报册还写「可望雨泽」，五月的报册写「麦尽枯」。城外粥厂的米，是顺天府自己垫的，垫到五月，府库也空了。`,"y13-purge":`去年京察去了二百三十七人。被黜的人没有申诉的路——京察的结论是「考察」，不是「论罪」，所以不须证据。顾宪成想争的，就是这一点。`,"y13-liaodong":`辽东的屯田册子上有五万七千顷，实际能收粮的不足八千。中间的差额，一半在逃军的名字底下，一半在将领的私囊里。`,"y14-guoben":`皇长子五岁，中宫无出。皇三子刚生，其母郑氏即进封皇贵妃，位在皇长子的母亲之上。这一步走得太明白了，明白到朝里没有人看不懂。`,"y14-petition":`请立东宫的折子递了三次，降调了四个人。第四次是一个刑部主事递的——官不大，话说得最狠：「若臣言不当，请先赐臣死。」`,"y14-nihon":`日本的事，靠朝鲜的使臣传话。对马岛离釜山五十里，消息要到辽东，再转到京师，前后两个月。等你知道，事情已经发生过了。`,"y15-hairui":`海瑞在南京做右都御史两年，上过一道疏，说「陛下励精图治，而治化不臻者，贪吏之刑轻也」。这道疏递上去，没人接话。`,"y15-qijiguang":`戚继光镇蓟十六年，修空心敌台一千二百座，练车营，蓟门晏然。张居正一死，弹章就来了——理由是「久任不迁」，这四个字不算罪，可也不算清白。`,"y15-jingying":`京营的册子上有十一万七千兵。这册子二十年没变过，因为变一次，就要有人交出吃了二十年的空饷。`,"jz-merge":`建州左卫自永乐年间设，世袭都指挥使。努尔哈赤起兵时只有十三副遗甲，两年并了三部。辽东的奏报一直说「一部酋耳」——这话在王杲身上说过，在王台身上说过，每一次都说对了。`,"jz-city":`万历十一年的奏报说建州「不过数百」。十五年，费阿拉城内城三层、外城五里。四年间，辽东换了三任巡抚，每一任都上过疏，每一份疏都用了「相机」两个字。`,"qz-final":`清丈从万历八年办到十三年，五年。王国光在户部九年，这件事是他一手办的。账做完了，他上疏乞休 —— 他知道这本账刊出去，得罪的人会记他一辈子。`,"fb-after":`冯保去后，司礼监掌印的位子空了半个月。批红的笔没人执，内阁的票拟堆在文书房，一道也发不下去。内廷八位秉笔，人人都在等。`,"fb-corrupt":`新掌印上任一年，内帑的簿籍第一次对不上。这事在冯保身上发生过，冯保的下场是发去南京种菜。可这一次，劾本递上来，恰好落在被劾的人手里拟旨。`,"kc-loose-end":`宽考一年。州县不必再怕降级，催科的劲就松了 —— 松的是催科，紧的是国库。户部现在只有两个办法：加派，或者借支。两个都不是好办法。`,"kc-harsh-end":`沂州今年报完九成一。这个数字刚好过关，也刚好说明问题：九成一里有三成是挪借的，一成是胥吏垫的，真正出于民的不过五成。`,"purge-backlash":`朝中没有人是孤身一人的。一个人的去留，往后牵着一串人：同年的、同乡的、同门的。所以罢一个人，从来不是罢一个人。`,"raid-alert":`察哈尔土蛮部自去年起就在锦义一带试探，先劫边堡，再掠屯田。边将报的是「小警」，按例不必上闻——这一次成规模了，才报到御前。`,"frontier-pay":`九边年例银岁额三百多万两，本年解到一半。欠的那一半，户部的说法是「各省逋欠未到」，兵部的说法是「户部扣着不放」。边军看到的只有一样：饷没到。`,mutiny:`饷欠七个月。这在九边不算新鲜事——宣大欠过十个月，辽东欠过一年。这回闹起来，是因为坐营官当着军士的面，把最后一批饷银扣下了一半。`,"hubu-routine":`太仓的账，一旬一报。入的比出的少，这个缺口已经连着报了七旬。`,"neifu-ask":`慈宁宫西配殿的梁是嘉靖年间的旧料，今年三月发现朽了。工部估过价，可户部说太仓不足。圣母还住在里头。`,arrears:`天下逋欠一百四十七万两。其中三成是灾伤蠲免，该蠲；剩下七成是拖欠——拖欠里又有真假两种。`,kaikuang:`太仓连年支绌，内官监提了一个法子：开矿。本朝开过，前朝也开过，每次开完，地方上都要闹几年。`,caoliang:`漕河自济宁以北水浅，粮船堵了一千二百只。这是今夏第三回堵，前两回靠降雨解的围。`,tingtui:`位子空了，按例要会推。会推的名单是吏部拟的，九卿科道画圈——你能选的只有圈上的三个人。`,kaoman:`三年一次的考察。名单是吏部考功司拟的，拟的时候有人来打招呼；挡不住的那几个，郎中在名字旁边画了圈。`,dingyou:`郑洛任宣大总督三年。去年俺答的孙子扯力克与三娘子争位，宣大口外诸部骑墙观望，全靠郑洛压着。他一走，这摊子要重新捋。`,"tribute-arrive":`朝鲜例贡一年一次。今年的使团四十七人，走的是辽东陆路——往年走海路，今年海上有警。`,"market-ask":`俺答封贡是隆庆五年的事，到今十二年。马市一年两回，边墙上的草长起来了，宣大的兵也松了。`,"vassal-plea":`日本关白丰臣秀吉去年平定九州，今年初调兵到对马岛。朝鲜的使臣是走海路来的，路上走了二十天。`,"tusi-rebel":`播州杨氏从唐朝据有此地，八百年。杨应龙袭职十一年，修海龙屯、养苗兵，贵州报过三次，四川都压下去了。`,drought:`山东自三月不雨。四月的报册写「雨泽调匀」，六月的报册写「禾苗尽枯」——中间隔了两个月，是县里压着不报。`,flood:`高家堰是淮扬七州县的命。万历六年潘季驯主持修筑，束水攻沙，保了五年。今年伏秋的汛比往年大。`,"locust-plague":`河南先旱后蝗。蝗是从北边飞来的，起于大名，过黄河，落开封。旱灾之后必有大疫，这是老规矩。`,earthquake:`京师地震，声自西北来。钦天监的占书说「臣道太盛」——这话在张居正死后第二年说，意思很清楚。`,"salt-tax":`两淮盐课是天下盐课之半。盐引壅积一百二十万道，商人不肯中，课银就收不上来。`,weaving:`苏杭织造是内廷的差事，太监领银、机户织造。上用缎匹原额一万匹，今年不够用。`,exam:`本科会试，天下举人四千六百人入场，取中三百五十名。殿试只定甲第，不落一人。`,"clan-stipend":`河南一省岁入二百八十万石，宗禄需二百四十万石。这个数已经撑了二十年，今年撑不住。`,vagrant:`荆襄山中的流民是成化年间留下的老问题。那一年驱还本籍，杀了十几万。今年又聚了二十几万。`,armory:`京营军器十年没晒过。盔甲三千副可用者九百，弓箭五万支可用者一万二，火器炸过三门。`,recommend:`荐举是祖宗的旧制：大臣荐举、吏部查议、皇帝简用。问题是荐举的人大多荐自己的门生。`,auspice:`祥瑞是历代都有的东西。一茎九穗的嘉禾、白鹿、甘露——报上来的人要的是赏，不是信。`};function ft(e){return dt[e]}var pt=8,mt=0;function ht(e,t){if(e.when&&!e.when(t)||e.requires&&!e.requires.every(e=>(t.flags[e]??0)>0)||e.forbids&&e.forbids.some(e=>(t.flags[e]??0)>0))return!1;let n=t.flags[`tpl_${e.id}`]??-999,r=e.cooldown??pt;return t.turn-n>=r}function gt(e,t){let n=sn[t];if(!n||n.when&&!n.when(e)||n.requires&&!n.requires.every(t=>(e.flags[t]??0)>0)||n.forbids&&n.forbids.some(t=>(e.flags[t]??0)>0))return null;let r=n.build(e);mt+=1;let i=ut(e,r.from);return{...r,from:i.text,senderId:i. :{id:M,progress:4,reported:5,resistance:-6},metrics:{minxin:2},energy:-1,log:`发太仓银十五万两充清丈工食。州县不必再摊派，怨声稍息。`}},{key:`cui`,label:`限三月报竣，逾期者参奏`,needsReading:!0,note:`张居正的路子。快，但会逼出假账`,effect:{project:{id:M,progress:5,reported:11,resistance:7},metrics:{guanfeng:2,minxin:-2},flags:{qingzhang_harsh:1,qz_known:1},energy:-1,log:`严旨切责清丈，限三月报竣。报册如雪片一般飞进通政司。`}},{key:`ba`,label:`罢了这差事，照旧额征收`,needsReading:!0,note:`张四维想听的就是这句。说了，清丈就废了`,effect:{project:{id:M,status:`failed`,resistance:20},metrics:{minxin:4,guanfeng:-4,chaoshi:2},flags:{qingzhang_abandoned:1},energy:-1,log:`诏令清丈照旧额征收，不必苛求。天下州县，如释重负。`}}]}},{line:`qingzhang`,weight:3,cooldown:8,sets:[`qz_open`],when:e=>!e.flags.qz_open}),bt=j(`qz-secret`,`urgent`,e=>{let t=e.projects.find(e=>e.id===M),n=Math.round(t?.progress??0);return{from:`巡按直隶监察御史（密奏）`,title:`为密陈清丈虚饰事`,summary:`臣亲验田册三十七处，真数视所报不及四成。此系密封，乞御览后焚之。`,body:`臣谨密奏。这一本，臣不敢发抄，不敢叫人看见。

臣走了大名、广平、顺德三府，亲手抽丈了三十七处。看到三样东西，叫臣心里发凉：

一、各县报的顷亩，多半是照旧额抄一遍，末了加个零头，凑个好看。
二、有些册子上田连阡陌，臣照着去量，荒草没人，连牛都进不去。
三、臣问一个知县，为什么不上实报。他跪下来，说：「老爷，报了实，小的立刻革职；报个虚的，将来查出来，也不过是革职。左右是个革职，小的总想多捱两年。」

臣算了一遍：如今户部题报的是${Math.round(t?.reported??0)}分，臣抽验下来，实不过${n}分。\n\n臣不敢说这是哪一个人的罪。这是法的毛病，不是人的毛病。太急，就假。\n\n伏乞圣明裁察。`,piaoni:`密奏留中，不必发抄。`,secret:`这本疏没有经过内阁。是巡按直封进宫的——也就是说，写这本的人没打算升官。`,yiEffect:{project:{id:M,expose:!0},flags:{mizou_seen:1},log:`密奏留中。你现在知道那个数是假的了。`},patience:8,ignoredEffect:{project:{id:M,resistance:5},flags:{mizou_seen:1,qz_cover:1},log:`密奏压在案头没看。那位御史后来调走了，走之前没再说一句话。`},options:[{key:`yi`,label:`依拟（留中不发）`,effect:{project:{id:M,expose:!0},flags:{mizou_seen:1,qz_cover:1},metrics:{guanfeng:-2},log:`密奏留中。你知道了这个数，然后什么也没做。`}},{key:`cha`,label:`密令各省巡按据实覆核`,needsReading:!0,note:`把假的推倒重来。清丈要再拖一年`,effect:{taicang:-10,project:{id:M,expose:!0,reported:-Math.max(0,Math.round((t?.reported??40)-(t?.progress??0)-6)),resistance:9},metrics:{guanfeng:4,minxin:-2},flags:{mizou_seen:1,qz_reset:1},energy:-1,log:`密令各省巡按据实覆核。三个月后报册回到案头，数字少了近一半——这一回大概是真的。`}},{key:`zhao`,label:`召王国光来问`,needsReading:!0,note:`他是承办的人。你要看看他的脸`,effect:{project:{id:M,expose:!0,resistance:3},flags:{mizou_seen:1,qz_ask:1},energy:-3,log:`召户部尚书王国光问清丈的事。他跪了很久，才开口：「臣也知道。可皇上，臣要是一句一句往上报，这差事当天就办不下去。」`}}]}},{line:`qingzhang`,requires:[`qz_open`],cooldown:999,forbids:[`mizou_seen`]}),xt=j(`qz-reset`,`project`,()=>({from:`南直隶巡按御史`,title:`为清丈激变、士民鼓噪事`,summary:`覆核田亩，触动乡绅。徽州、宁国二府士绅闭城罢市，呈文告御状。`,body:`臣谨奏：覆核的令一下来，出了事。

徽州、宁国两府，乡绅聚了三百多人，把府衙围了。他们说：田是祖宗传下来的，凭什么重新丈？有的把田契烧在衙门口，有的把大门锁了，罢市三天。

带头的几个人，臣查了，两个是举人，一个是退休的知府。他们不是乱民，他们是有功名的。

臣若拿人，就是与士林为敌；臣若不拿，摊子就散在这两府。

伏乞圣裁。`,piaoni:`着抚臣抚谕，不必深究。`,secret:`「不必深究」四个字，是申时行加的。他怕的是激出大乱子——可他也知道，这一让，覆核就覆不下去了。`,yiEffect:{project:{id:M,progress:-3,resistance:6},metrics:{minxin:2,guanfeng:-3},log:`诏抚谕徽宁士绅，不必深究。覆核之事，缓了下来。`},patience:4,ignoredEffect:{metrics:{chaoshi:-3,minxin:-4},project:{id:M,progress:-5},log:`徽宁士绅的事没人管。两府的田册，原样封存，再没人动过。`},options:[{key:`yi`,label:`依拟（抚谕，不深究）`,effect:{project:{id:M,progress:-3,resistance:6},metrics:{minxin:2,guanfeng:-3},log:`抚谕徽宁士绅。覆核缓了下来。`}},{key:`na`,label:`拿为首的三人，解京问罪`,needsReading:!0,note:`一刀切下去。切得断，也切得疼`,effect:{project:{id:M,progress:4,resistance:10},metrics:{guanfeng:4,chaoshi:-5,minxin:-3},flags:{scholar_anger:1},energy:-1,log:`拿徽宁士绅为首三人解京。天下士人哗然，说朝廷与读书人为难。`}},{key:`fen`,label:`分而治之：只查大户，免小户`,needsReading:!0,note:`把多数人摘出来，只跟最富的几家过不去`,effect:{project:{id:M,progress:2,resistance:-4},metrics:{minxin:4,guanfeng:1},energy:-1,log:`令只查田过千亩者，小户免丈。徽宁的围解了，几家大族的田册被抬进了衙门。`}}]}),{line:`qingzhang`,requires:[`qz_reset`],cooldown:999}),St=j(`qz-ask`,`personnel`,()=>({from:`户部尚书 王国光`,title:`为奉职无状、乞赐罢黜事`,summary:`臣办清丈二年，不能使下无虚饰，此臣之罪。乞罢臣职，以谢天下。`,body:`臣王国光谨奏：臣请辞。

清丈办了两年，报上来的是八成，实数是四成。臣是承办的人，臣不能推给别人。

臣不是不知道底下作假。臣知道。可臣若一个个查，这差事十年也办不完；臣若不查，就是欺君。臣夹在中间，两年了。

臣今年七十一。臣想歇了。

伏乞皇上允臣致仕。`,piaoni:`王国光老成练达，着慰留，不必再辞。`,secret:`拟这道票拟的是张四维。他一边慰留王国光，一边已经在物色接任的人——户部这个位子，他想要。`,yiEffect:{metrics:{chaoshi:1},log:`慰留王国光。他没再辞。`},patience:5,options:[{key:`yi`,label:`依拟（慰留）`,effect:{metrics:{chaoshi:1},flags:{wang_stay:1},log:`慰留王国光。他叩了头，没再说话。`}},{key:`fang`,label:`准其致仕，另简能员`,needsReading:!0,note:`放他走。户部换个主，清丈也就换个命`,effect:{appoint:{officerId:`wangguanguang`,officeId:null},project:{id:M,progress:-6,resistance:4},metrics:{guanfeng:-2,chaoshi:-2},energy:-1,log:`准王国光致仕。他出京那天，户部的属吏送到城外。`}},{key:`ze`,label:`不准辞，且责其二年之欺`,needsReading:!0,note:`骂他一顿，让他戴罪办事。他会记住这一刻`,effect:{project:{id:M,progress:6,resistance:8},metrics:{guanfeng:3,chaoshi:-3},flags:{wang_ashamed:1},energy:-1,log:`不准辞，切责其二年虚饰之罪。王国光免冠叩首，额上见了血。此后三个月，他亲自下到顺天府抽丈。`}}]}),{line:`qingzhang`,requires:[`qz_ask`],cooldown:999}),Ct=j(`fb-impeach`,`impeach`,()=>({from:`江西道监察御史 李植`,title:`为劾奏权珰不法、恳乞乾断事`,summary:`劾司礼监掌印太监冯保十二大罪，请下法司逮问、籍没家产。`,body:`臣李植谨奏：臣要参一个人。

司礼监掌印太监冯保，伺候过三朝，掌着批红的笔，掌着东厂的缉事。二十年了。臣说他十二桩罪，桩桩都有实据：一、私藏御用之物；二、家里金银过百万；三、卖官；四、侵盗内帑；五、假传旨意害人；六、结党；七、纵容家奴占人田产；八、蒙蔽圣聪；九、紊乱朝纲；十、交通边镇；十一、怨望君父；十二、欺凌百官。

臣是个七品官。臣说这些话，是拿这条命在说。

臣请皇上大奋乾断，将冯保下法司逮问，籍没家产，以正国法。`,piaoni:`冯保是先帝留下来的人，伺候多年。说办就办，怕伤了先帝知人的明。拟交部院议处。`,secret:`这道票拟是张四维的手笔。他恨冯保很久了——但更要紧的是，他知道冯保一倒，司礼监的位子就空出来了。`,yiEffect:{metrics:{chaoshi:-3,guanfeng:-2},flags:{fb_alive:1},log:`李植劾冯保，交部院议处。议了三个月，没议出结果。`},patience:2,ignoredEffect:{metrics:{chaoshi:-5,guanfeng:-3},flags:{fb_alive:1},log:`劾冯保的疏留中不发。冯保照旧掌印，李植被罚俸三月。`},options:[{key:`yi`,label:`依拟（下部院议处）`,effect:{metrics:{chaoshi:-3,guanfeng:-2},flags:{fb_alive:1},log:`交部院议处。天下人都在等，等来等去，等到一道温旨。`}},{key:`ji`,label:`即下诏逮问，籍其家`,needsReading:!0,note:`这本疏，你等了很久了`,effect:{taicang:105,metrics:{chaoshi:-7,guanfeng:5,minxin:3},flags:{fb_dead:1},energy:-1,log:`诏逮冯保，籍其家。金银一百余万两，珠宝堆了一院子。发南京孝陵种菜。内廷上下，一夜之间都老实了。`}},{key:`jiang`,label:`降为奉御，发南京闲住`,needsReading:!0,note:`留他一条命。宦官会记住这份恩，也会记住这份怕`,effect:{taicang:38,metrics:{chaoshi:2,guanfeng:1},flags:{fb_exiled:1},energy:-1,log:`降冯保为奉御，发南京闲住。家产籍没三分之一。`}}]}),{line:`eunuch`,when:e=>e.date.year===1582&&e.date.month>=11,cooldown:999,sets:[`fb_charged`],forbids:[`fb_charged`]}),wt=j(`fb-panic`,`routine`,()=>({from:`司礼监秉笔太监 张诚`,title:`为内廷惊惧、乞示宽旨事`,summary:`冯保既籍，内臣人人自危。掌印以下，多有称病不出者。`,body:`奴才张诚谨奏：冯公公的事办完，内廷就乱了。

十二监四司八局，这几天称病告假的，有三十多人。不是真病，是怕。他们想，冯公公掌印二十年都办了，我们算什么。

奴才不敢替他们求情。奴才是想说一句：这些人里头，有的是冯公公的党，有的是跟了冯公公三十年、端过他茶碗的。可也有的，什么都没干过，就是怕。

请皇上下一道旨，说一句宽心的话。这一句，比发多少银子都管用。`,piaoni:`着司礼监晓谕，安心供职，不必惊疑。`,secret:`张诚自己就是最怕的那一个。他上这道疏，一半是为别人，一半是为自己探口风。`,yiEffect:{metrics:{chaoshi:3},log:`晓谕内廷安心供职。称病的陆续都回来了。`},patience:6,options:[{key:`yi`,label:`依拟（晓谕安心）`,effect:{metrics:{chaoshi:3},log:`晓谕内廷安心供职。`}},{key:`cha`,label:`趁势清查：凡冯保党羽，尽数革退`,needsReading:!0,note:`斩草除根。可内廷一空，谁替你批红`,effect:{taicang:18,metrics:{chaoshi:-6,guanfeng:2},flags:{eunuch_purge:1},energy:-1,log:`清查冯保党羽，革退内臣一百四十余人。内廷一时无人办事，批红积压了半个月。`}},{key:`liu`,label:`留几个能办事的，其余不问`,needsReading:!0,note:`内廷是个手艺活，换一批生手，你这个皇帝先受不了`,effect:{metrics:{chaoshi:5,guanfeng:-2},flags:{eunuch_kept:1},energy:-1,log:`只黜首恶数人，其余安心供职。内廷三日就恢复了旧样。`}}]}),{line:`eunuch`,requires:[`fb_dead`],cooldown:999}),Tt=j(`fb-plot`,`impeach`,()=>({from:`东厂提督太监`,title:`为密陈外廷交通内臣事`,summary:`访得若干廷臣与南京闲住之冯保书信往来，谨密陈姓名。`,body:`奴才谨密奏：冯保到南京之后，还有人来往。

东厂访得，这两个月给他递过信的，有七个人。三个是外省的知府，一个是通政司的参议，两个是内官监的旧人。还有一个——奴才不敢写在这里，请皇上自己看附的名单。

奴才不是说他们要反。人倒了，还有人肯问候一句，这是人情。

可奴才的差事，是把这些事报上来。报上来，皇上心里有数；不报，奴才就是失职。`,piaoni:`知道了。名单留中。`,secret:`这份名单里，有一个是张四维的门生。东厂敢报，说明东厂背后有人撑腰——撑腰的人，正想动张四维。`,yiEffect:{metrics:{chaoshi:-1},log:`东厂密陈名单，留中。`},patience:6,options:[{key:`yi`,label:`依拟（留中）`,effect:{metrics:{chaoshi:-1}}},{key:`cha`,label:`按名单查办`,needsReading:!0,note:`顺藤摸下去。摸到谁，谁就倒霉`,effect:{metrics:{chaoshi:-6,guanfeng:3},flags:{eunuch_terror:1},energy:-1,log:`按东厂名单查办，革职五人，下狱二人。朝中一时人人自危，连内阁的票拟都变得极谨慎——凡有风险的事，一律拟「再议」。`}},{key:`shao`,label:`烧了名单，只诫东厂勿再缉访外廷`,needsReading:!0,note:`把刀收起来。可刀收起来，别人就会以为你不敢用`,effect:{metrics:{chaoshi:4,guanfeng:-2},flags:{factory_restrained:1},energy:-1,log:`焚东厂名单，戒其勿再缉访外廷。外廷闻之，颇有颂圣德者。`}}]}),{line:`eunuch`,requires:[`fb_exiled`],weight:2,cooldown:999}),Et=j(`kc-debate`,`personnel`,()=>({from:`内阁首辅 张四维`,title:`为陈时政、乞宽考成事`,summary:`请将考成之法量从宽假：征赋以八分为率，违限者罚俸，勿遽降黜。`,body:`臣张四维谨奏：先太师当国十年，法度修明，这是他的功，臣不敢抹。

可是考成这一条，臣以为太急了些。如今是什么光景？州县官怕考成，怕到不敢报灾。报了灾就要蠲，蠲了就不够数，不够数就要降级。所以他宁可让百姓饿着，也要把数凑齐。

臣在下面待过，见过这样的县官：催科催到半夜，回到后堂，坐着哭。第二天接着催。

臣请把考成的规矩松一松：征赋以八分为率，违限的罚俸，不要动不动就降级调任。

法太紧，人就会说谎。这是臣这几十年看下来的。`,piaoni:`所奏深切时弊。着吏部、户部会看具奏。`,secret:`张四维要宽考成，一半是政见，一半是买人心。他刚接首辅，需要人说他好——而考成法，是最好的一份人情。`,yiEffect:{policy:{quota:80,severity:1},flags:{kc_loose:1},log:`诏宽考成：征赋以八分为率，违限罚俸。天下有司，如释重负。`},patience:6,ignoredEffect:{metrics:{chaoshi:-3,guanfeng:-1},flags:{kc_mid:1},log:`请宽考成的疏留中。张四维等了十天，没有再问。`},options:[{key:`yi`,label:`依拟（宽考成）`,effect:{policy:{quota:80,severity:1},flags:{kc_loose:1},log:`诏宽考成。天下有司如释重负，而考成之法，自此名存实亡。`}},{key:`bu`,label:`不许：先太师的法，不可轻改`,needsReading:!0,note:`你保住了这台机器。可是推这台机器的人，刚死了`,effect:{policy:{quota:90,severity:3},metrics:{chaoshi:-3,guanfeng:4,minxin:-3},flags:{kc_harsh:1},energy:-1,log:`诏：考成之法，祖宗成宪，不可轻改。张四维顿首称善，退朝时脚步很慢。`}},{key:`zhe`,label:`折中：九分为率，降黜改罚俸`,needsReading:!0,note:`谁都不得罪，也就谁都不满意`,effect:{policy:{quota:90,severity:2},metrics:{minxin:2,guanfeng:-1},flags:{kc_mid:1},energy:-1,log:`诏：考成以九分为率，违限者罚俸，不必遽降。`}}]}),{line:`kaocheng`,when:e=>e.turn>=6&&!e.flags.kc_loose&&!e.flags.kc_harsh&&!e.flags.kc_mid,cooldown:999}),Dt=j(`kc-loose`,`urgent`,e=>({from:`户部尚书`,title:`为逋欠骤增、国用告急事`,summary:`考成既宽，各省拖欠银两激增。太仓见存${Math.round(e.taicang)}万两，不足以支边饷。`,body:`臣谨奏：宽考成的诏下去三个月，天下的逋欠就涨了。

各省报来，拖欠的银子，比去年多了六十万两。不是百姓不交，是州县不催了。州县为什么不催？因为催了也没人罚他。

臣不是说宽考成不好。臣是说：宽了之后，得有别的法子。

如今太仓见存${Math.round(e.taicang)}万两。下个月的九边年例，发不出去。`,piaoni:`着户部议措处之法。`,secret:`这道疏送到内阁，压了六天——张四维不想让它在你看到宽考成的坏处之前送到。`,yiEffect:{taicang:6,metrics:{minxin:-2},log:`户部议措处，加派六万两。`},patience:3,ignoredEffect:{taicang:-10,metrics:{bianfang:-4,chaoshi:-3},log:`逋欠的事没人管。边饷发不出，三个镇同时告急。`},options:[{key:`yi`,label:`依拟（户部议措处）`,effect:{taicang:6,metrics:{minxin:-2},log:`户部措处，加派六万。`}},{key:`jia`,label:`加派天下田赋，每亩三厘`,needsReading:!0,note:`钱能收上来。可你刚宽了考成，又加派，等于把好处收回去了`,effect:{taicang:24,metrics:{minxin:-8,chaoshi:-2},flags:{surtax:1},energy:-1,log:`加派天下田赋，每亩三厘，岁入增二十四万两。民间谓之「宽了考成，紧了口袋」。`}},{key:`nei`,label:`发内帑二十万两补边饷`,needsReading:!0,note:`你自己的钱。用了，就没有退路了`,effect:{neitang:-20,metrics:{guanfeng:4,chaoshi:3},flags:{neitang_used:1},energy:-1,log:`发内帑二十万两补边饷。户部尚书在文华门外跪谢，说「圣德」。`}},{key:`fu`,label:`恢复考成旧法`,needsReading:!0,note:`三个月前你刚宽了它。现在收回来，等于承认那道旨错了`,effect:{policy:{quota:92,severity:3},taicang:18,metrics:{guanfeng:6,minxin:-5,chaoshi:-4},flags:{kc_reversed:1},energy:-1,log:`诏复考成旧法。天下州县，一夜之间又变回了原来的样子。`}}]}),{line:`kaocheng`,requires:[`kc_loose`],cooldown:999}),Ot=j(`kc-harsh`,`urgent`,()=>({from:`吏部尚书`,title:`为县令自尽、士论沸腾事`,summary:`山东费县知县以征赋不足九分，闻将降黜，自缢于县衙。士林哗然。`,body:`臣谨奏：出了人命。

山东费县的知县，姓王，今年四十。考成核下来，他那一县征赋只完了八分六厘，差四厘。按新例，降三级调用。

他知道的那天晚上，把印挂在梁上，人吊在旁边。

他留下一张字条，说：费县今年旱，他蠲了三百户的税。蠲了就不够数。他说他不敢报灾，报了灾是「规避」，罪更重。

臣不敢说这道法不对。臣只是把这件事报上来。`,piaoni:`着有司优恤。其蠲免之事，查明具奏。`,secret:`吏部这道票拟写得很小心。他们不敢说「法太苛」，只敢说「优恤」——因为说前者，就是议你的政。`,yiEffect:{metrics:{guanfeng:-3,minxin:2,chaoshi:-2},log:`优恤费县知县。士论稍平。`},patience:4,ignoredEffect:{metrics:{guanfeng:-5,chaoshi:-4},log:`费县知县的事没有下文。此后半年，山东有四个知县告病，两个挂印走了。`},options:[{key:`yi`,label:`依拟（优恤）`,effect:{metrics:{guanfeng:-3,minxin:2,chaoshi:-2},log:`优恤费县知县。`}},{key:`gai`,label:`改例：灾伤蠲免者，不入考成`,needsReading:!0,note:`把制度的漏洞补上。可这么一补，又有人要钻`,effect:{policy:{quota:88,severity:2},metrics:{guanfeng:5,minxin:3,chaoshi:2},flags:{kc_fixed:1},energy:-1,log:`改考成例：灾伤蠲免者不入考成。天下州县闻之，多有泣者。`}},{key:`chi`,label:`斥其规避，着追夺诰命`,needsReading:!0,note:`人死了还要罚。这样的事，史书上会记一笔`,effect:{metrics:{guanfeng:-8,chaoshi:-5,minxin:-4},flags:{cruel:1},energy:-1,log:`斥费县知县规避考成，追夺诰命。士林大哗，有翰林作诗讽之。`}}]}),{line:`kaocheng`,requires:[`kc_harsh`],cooldown:999}),kt=j(`settle-zhang`,`impeach`,()=>({from:`云南道监察御史 羊可立`,title:`为追论故辅罪状、乞正国法事`,summary:`劾张居正夺辽王府第、侵占王产，请追夺官爵、籍没家产。`,body:`臣羊可立谨奏：张居正死了快一年了。臣以为，有些账，该算了。

其一，他当国十年，威权震主。天下人只知道有首辅，不知道有皇上。
其二，他为了报私仇，把辽王废了，幽死在里头，辽王府的家产，进了张家的门。
其三，他三个儿子连科登第，占着高第，天下士人侧目而视，没有一个敢说话。
其四，他与冯保表里为奸，凡是要贬谁、要升谁，两个人关起门来就定了。

如今冯保已经伏罪。张居正的罪，难道就这么算了？

臣请追夺他的官爵，籍没他的家产，以正国法，以谢天下。`,piaoni:`张居正的功过，天下自有公论。这道疏说得过了，不准。`,secret:`拟这道票拟的是申时行。他知道拦不住——他只是想让自己在史书上留一句「曾为张居正说过话」。`,yiEffect:{metrics:{chaoshi:2,guanfeng:1},log:`羊可立论张居正，不准。言官议论纷纷。`},patience:4,ignoredEffect:{metrics:{chaoshi:-3,guanfeng:-2},log:`追论张居正的疏留中。言官愈发不平，弹章一天几本往上递。`},options:[{key:`yi`,label:`依拟（不准）`,effect:{metrics:{chaoshi:2,guanfeng:1},log:`追论张居正，不准。`}},{key:`ji`,label:`籍其家`,needsReading:!0,note:`抄一个死人的家。你会得到一些银子，和一段余生都要被提起的事`,effect:{taicang:22,metrics:{chaoshi:-9,guanfeng:-7,minxin:-2},flags:{zhang_ruined:1},energy:-1,log:`诏籍张居正家。得黄金二千四百余两，白银十万七千余两——不及冯保的十分之一。其长子敬修留血书自缢。家中老小封在府里，饿死十七口，中有婴儿三。消息传出，天下寒心。`}},{key:`xue`,label:`削其官爵、夺其谥，不籍家`,needsReading:!0,note:`罚他，但不砸他的家。这需要一点分寸，也需要一点胆`,effect:{metrics:{chaoshi:-2,guanfeng:-1,minxin:2},flags:{zhang_stripped:1},energy:-1,log:`诏削张居正官爵，夺谥，不籍其家。他母亲八十岁了，得终天年。`}}]}),{line:`zhang`,when:e=>e.date.year>=1583&&e.date.month>=3,cooldown:999,forbids:[`zhang_ruined`,`zhang_stripped`]}),At=[yt,bt,xt,St,j(`qz-routine`,`project`,e=>{let t=e.projects.find(e=>e.id===M),n=Math.round(t.reported);return{from:`户部清吏司`,title:`为清丈旬报事`,summary:`各省续报丈量，合已丈过${n}分。`,body:`臣谨奏：清丈的旬报。\n\n各省续报，合已丈过${n}分。河南、山东两处报得快，陕西、云贵报得慢——山路难走，一县的册子要两个月才到府。\n\n臣不多说。只报一个数，请皇上心里有数。`,piaoni:`知道了。`,secret:`「知道了」三个字，是司礼监代批的。批了这两个字，这一旬就算过去了。`,yiEffect:{project:{id:M,progress:1.2,reported:3}},patience:6,ignoredEffect:{project:{id:M,progress:-.8,resistance:2},log:`清丈旬报压在案上。下一旬的报册，就不那么及时了。`},options:[{key:`yi`,label:`依拟`,effect:{project:{id:M,progress:1.2,reported:3}}},{key:`cui`,label:`催陕西、云贵两处`,needsReading:!0,note:`山路难走是真的。但你等不起`,effect:{project:{id:M,progress:2,reported:3.5,resistance:3},metrics:{minxin:-1},energy:-1,log:`严催陕云两省清丈。两省的报册，下月果然厚了些——至于实不实，另说。`}}]}},{weight:2,cooldown:9,requires:[`qz_open`],forbids:[`qingzhang_abandoned`]}),j(`qz-m30`,`personnel`,()=>({from:`襄王（藩府）`,title:`为恭进微仪、以备国用事`,summary:`襄王遣使赍黄金千两、缎二百匹入京，称「愿为朝廷效力」。`,body:`臣襄王谨启：臣闻朝廷清丈田亩，为国裕赋，此万世之利，臣不胜欣忭。

臣府中薄有蓄积，谨进黄金一千两、缎二百匹，以备国用。区区微仪，不敢称贡。

臣更有请者：臣府旧有庄田数处，皆祖宗所赐，册籍分明。清丈之日，乞敕有司照旧额存留，不必重丈，以全亲亲之谊。

臣不胜战栗待罪之至。`,piaoni:`藩王进献，于礼不宜受。其所请，着户部查旧例具奏。`,secret:`一千两黄金，换的是「不必重丈」四个字。这笔买卖他算得很清楚：藩府的庄田，隐占的何止十倍。`,yiEffect:{metrics:{chaoshi:1},project:{id:M,resistance:3},log:`襄王进献，依拟却之。其所请，户部查例。`},patience:4,ignoredEffect:{project:{id:M,resistance:6},log:`襄王的疏压在案上。别的王府看着，也都不说话了——他们在等这个头怎么开。`},options:[{key:`yi`,label:`依拟（却之）`,effect:{metrics:{chaoshi:1},project:{id:M,resistance:3},log:`却襄王进献。`}},{key:`shou`,label:`受其献，许其庄田免丈`,needsReading:!0,note:`一千两黄金。可这一开口，全天下的王府都会来要`,effect:{taicang:8,metrics:{guanfeng:-5,minxin:-3},project:{id:M,resistance:14,progress:-4},flags:{prifams_deal:1},energy:-1,log:`受襄王进献，许其庄田免丈。半月之内，另有六家王府上疏，所请如出一辙。`}},{key:`ji`,label:`却其献，并令先丈襄府`,needsReading:!0,note:`拿最大的开刀。一刀下去，要么立威，要么结仇`,effect:{project:{id:M,progress:5,resistance:12},metrics:{guanfeng:4,chaoshi:-4},flags:{prifams_anger:1},energy:-1,log:`却襄王献，令有司先丈襄府庄田。襄王闭门不出，宗人府递了话。`}}]}),{line:`qingzhang`,requires:[`qz_open`],cooldown:999,when:e=>(e.projects[0]?.progress??0)>=26&&!e.flags.qz_m30,sets:[`qz_m30`]}),j(`qz-m55`,`impeach`,()=>({from:`南直隶乡绅 联名`,title:`为清丈扰民、恳乞暂缓事`,summary:`苏松常镇四府乡绅二百余人联名呈控，言清丈胥吏索贿、拆户飞洒，民不堪命。`,body:`具呈南直隶苏州、松江、常州、镇江四府乡绅二百三十七人，为陈地方疾苦事。

臣请就地附籍，设官管理。`,piaoni:`户部看议。`,secret:`这一点，成化年间就闹过一次，杀了十几万人。写这道疏的巡抚，案头就摆着那一次的旧档。`,yiEffect:{minxin:2},patience:3,ignoredEffect:{metrics:{minxin:-6,chaoshi:-4},log:`荆襄流民的事没人管。半年后，山中有聚众数千，掠州县仓。`},options:[{key:`yi`,label:`依拟（就地附籍）`,effect:{metrics:{minxin:6,chaoshi:2},taicang:-3,flags:{vagrant_ok:1},log:`许荆襄流民就地附籍，设郧阳巡抚领之。二十万人，从此有了籍。`}},{key:`qu`,label:`驱还本籍`,needsReading:!0,note:`把他们赶回去。成化年间就是这么办的`,effect:{metrics:{minxin:-8,chaoshi:-5},taicang:-2,flags:{vagrant_drive:1},energy:-1,log:`驱荆襄流民还籍。沿途死者甚众，山中有拒捕者，杀伤兵丁。`}},{key:`bian`,label:`编为军屯，就近守御`,needsReading:!0,note:`给地、给身份，还多一支兵`,effect:{metrics:{bianfang:4,minxin:3},taicang:-5,flags:{vagrant_army:1},energy:-1,log:`编荆襄流民为军屯，授田守御。得壮丁三万，屯田十二万亩。`}}]}),{weight:1,cooldown:22}),j(`armory`,`routine`,()=>({from:`工部`,title:`为军器朽坏、请旨修造事`,summary:`京营盔甲弓箭，十之六七朽坏不堪。请发银八万两修造。`,body:`臣谨奏：臣奉命查京营军器。

臣问管库的，为什么烂成这样。他说：库里潮，十年没晒过。

臣请发银八万两修造。可臣也说一句：修好了没人管，还是要烂。`,piaoni:`工部知道。着动支节慎库银修造。`,secret:`「十年没晒过」是假话。真正的窟窿是每年领的修造银，都进了营官的口袋——这批军器报的是「已修」。`,yiEffect:{taicang:-6,metrics:{bianfang:1}},patience:6,options:[{key:`yi`,label:`依拟`,effect:{taicang:-6,metrics:{bianfang:1}}},{key:`cha`,label:`先查历年修造银的去向`,needsReading:!0,note:`修一次烂一次，钱到哪去了`,effect:{taicang:5,metrics:{guanfeng:4,chaoshi:-2},energy:-1,log:`查京营修造银。查出营官冒领四万两，下狱二人。`}},{key:`xiu`,label:`发银十万，并定三年一晒的规矩`,needsReading:!0,note:`多花两万，买个不再烂`,effect:{taicang:-10,metrics:{bianfang:4,guanfeng:2},flags:{armory_fixed:1},energy:-1,log:`发银十万修造军器，定三年一晒之例。`}}]}),{weight:2,cooldown:14}),j(`recommend`,`personnel`,e=>{let t=e.officers.filter(e=>e.officeId===null),n=t[e.turn*7%Math.max(1,t.length)];return{from:`礼部尚书`,title:`为荐举贤才、以备任使事`,summary:`臣荐${n?.name??`某人`}，谓其才堪大用。伏乞擢用。`,body:`臣谨荐一人：${n?.name??`某人`}，${n?.origin??``}人，${n?.jinshi??``}。\n\n臣与他同乡，不敢说没有私心。可臣确实见过他办事。他在县里修过一条渠，三年没有水患；断过一桩拖了十年的田产案，两造都服。\n\n臣的考语是：${n?.appraisal??``}\n\n用不用，皇上自己看。臣只是把这个人摆在这儿。`,piaoni:`着吏部查议。`,secret:`${n?.name??`此人`}是这位尚书的门生。荐举的规矩，本来就是拿人情换位置——只是这一次，这个人也许真的可用。`,yiEffect:{metrics:{guanfeng:1}},patience:8,options:[{key:`yi`,label:`依拟（吏部查议）`,effect:{metrics:{guanfeng:1}}},{key:`yong`,label:`即召见${n?.name??`此人`}`,needsReading:!0,note:`见一面再定。这一面不花什么，但你会记住他`,effect:{energy:-2,flags:{[`met_${n?.id}`]:1},log:`召见${n?.name??`其人`}。问了半个时辰，问的是渠怎么修、案怎么断。`}},{key:`bo`,label:`驳回，且责其市恩`,needsReading:!0,note:`荐举就是结党。这么骂一句，以后没人敢荐人了`,effect:{metrics:{chaoshi:2,guanfeng:-3},flags:{recommend_stop:1},energy:-1,log:`驳回荐举，切责其市恩。此后半年，无人荐人。`}}]}},{weight:2,cooldown:13}),j(`auspice`,`routine`,()=>({from:`河南巡抚`,title:`为恭进嘉禾、以彰圣德事`,summary:`祥符县产嘉禾，一茎九穗。臣谨绘图进呈。`,body:`臣谨奏：祥符县民田内，产嘉禾一茎九穗，高二尺余。父老以为未有之瑞。

伏乞宣付史馆，以昭盛美。`,piaoni:`知道了。图留中。`,secret:`一茎九穗的禾，是县官从三株禾上绑起来的。这种事，每一朝都有，每一朝都有人信。`,yiEffect:{metrics:{chaoshi:1}},patience:8,options:[{key:`yi`,label:`依拟（留中）`,effect:{metrics:{chaoshi:1},log:`嘉禾图留中。`}},{key:`xuan`,label:`宣付史馆，赏进瑞者`,needsReading:!0,note:`祥瑞是政治。信不信是另一回事`,effect:{metrics:{chaoshi:3,minxin:2,guanfeng:-1},log:`嘉禾宣付史馆，赏巡抚银币。此后一月，各省进瑞者七起。`}},{key:`chi`,label:`斥其虚妄，戒各省勿进祥瑞`,needsReading:!0,note:`一句话堵死这条路。会有人不高兴`,effect:{metrics:{guanfeng:3,chaoshi:-2},flags:{no_auspice:1},energy:-1,log:`斥祥瑞虚妄，诏各省勿进。礼部侍郎面色不佳。`}}]}),{weight:1,cooldown:18})],N=(e,t)=>!!e.statutes[t],Ht=(e,t)=>!e.statutes[t],Ut=j(`kc-abolished-pay`,`urgent`,e=>({from:`户部尚书`,title:`为逋欠骤增、国用告急事`,summary:`考成既罢，各省拖欠半年之内增至一百八十万。`,body:`臣谨奏：自《考成法》罢后，各省逋欠骤增。

上半年报部者，山东欠三十一万，河南欠二十七万，南直隶欠四十二万，合各省计之，已一百八十余万。去年这个时候，是七十六万。

臣细查其故：非百姓不纳，是州县不催。州县何以不催？从前完不成要降级，如今完不成只罚俸。罚俸一年，不过二十两。

臣不敢请复考成 —— 朝中正以「苛」字攻之。然太仓现在只余${Math.round(e.taicang)}万，九边的年例还欠着一半。这笔账，总要有人认。`,piaoni:`着户部严饬各抚按，照旧例催征。`,secret:`这道票拟是张四维拟的。他既要废考成，又要催征，两头都要占。「照旧例」三个字最妙——旧例就是没有考成的旧例。`,patience:3,yiEffect:{ledger:{taicang:12},metric:{chaoshi:-2}},ignoredEffect:{ledger:{taicang:-8},metric:{minxin:-3}},options:[{key:`restore`,label:`复考成，只宽一分`,note:`把「降三级」改为「降一级」，其余照旧`,effect:{ledger:{taicang:22},metric:{guanfeng:-4,chaoshi:-5,minxin:-2},flags:{kc_half_restored:1}}},{key:`borrow`,label:`向南京户部、太仆寺挪借`,note:`先过了今年，明年的账明年再说`,effect:{ledger:{taicang:26,taipu:-30},metric:{chaoshi:2}}}]}),{weight:0,cooldown:999,line:`st-kc`,when:e=>Ht(e,`kaocheng`)&&e.turn>=8,sets:[`kc_abolished_reported`]}),Wt=j(`ytb-jiangnan`,`urgent`,()=>({from:`应天巡抚`,title:`为江南赋重、民力不堪、乞赐酌议事`,summary:`一条鞭行于江南三月，苏松常镇四府士绅联名请缓。`,body:`臣谨奏：一条鞭法行于苏松常镇四府，三月于兹。

法本身是好的：赋役归并，计亩征银，胥吏不能飞洒，小民不受包揽之累。臣在任所见，里甲之弊，去其大半。

然有一事不能不奏：四府田赋甲于天下，一亩之入，不敷一亩之税。往时纳本色，尚可挪借；今改折银，秋成之日必须卖谷换银，谷贱银贵，一石只换得三钱。

今有华亭、上海、武进三县士绅联名具呈，乞将折银之数，每两减一钱。联名者二百四十七人，其中进士出身者三十一人。

臣不敢代为请，亦不敢壅于上闻。`,piaoni:`着户部查议。`,secret:`这二百四十七人里，有十九个是张四维的门生。他们不是替百姓请，是替自家的田请——折银折得越少，他们交得越少。`,patience:4,yiEffect:{ledger:{taicang:8},metric:{minxin:-3}},ignoredEffect:{metric:{minxin:-5,guanfeng:-2}},options:[{key:`cut`,label:`准减一钱，以示宽恤`,note:`江南人心得，太仓少收`,effect:{ledger:{taicang:-18},metric:{minxin:6,chaoshi:3},flags:{ytb_jiangnan_cut:1}}},{key:`hold`,label:`不许。法已立，不容再议`,note:`寸步不让，看谁先撑不住`,effect:{ledger:{taicang:10},metric:{chaoshi:-4,guanfeng:-2},flags:{ytb_jiangnan_hold:1}}}]}),{weight:0,cooldown:999,line:`st-ytb`,when:e=>N(e,`yitiaobian`)&&e.turn>=14}),Gt=j(`kh-pirate`,`urgent`,()=>({from:`福建巡抚`,title:`为海氛不靖、乞严守御事`,summary:`月港开关半载，商船日多，海寇亦混迹其中。`,body:`臣谨奏：月港开关以来，出海商船月增数十。关税所入，半年已得银二万三千两，是往年海禁时所无。

然有可虑者：商船既多，海寇亦混杂其中。真倭已少，多是漳泉之人，挟倭为名，聚众劫掠。前月南澳一役，官军追之，贼船反手就打，船比我们的快。

臣请于月港设水寨，募兵三千，岁需饷银六万。或者仍旧禁海，则此患自消 —— 只是那二万三千两的税，也没有了。`,piaoni:`着福建巡抚相机剿抚，兵部知道。`,secret:`这道票拟把「相机」两个字用得很好——相机就是没有定策。福建的兵，一半在卫所册子上，一半在将领的家丁里，真打起来不知道能调出多少人。`,patience:4,yiEffect:{metric:{bianfang:-2},ledger:{taicang:3}},ignoredEffect:{metric:{bianfang:-7,minxin:-4}},options:[{key:`navy`,label:`设水寨，募兵三千`,note:`岁费六万，海防才立得住`,effect:{ledger:{taicang:-30},metric:{bianfang:8},flags:{kh_navy:1}}},{key:`close`,label:`复禁海`,note:`一了百了，但税也没了`,effect:{statutes:{kaihai:!1},metric:{bianfang:4,minxin:-4,chaoshi:3}}}]}),{weight:0,cooldown:999,line:`st-kh`,when:e=>N(e,`kaihai`)&&e.turn>=20}),Kt=j(`kh-eunuch-tax`,`project`,()=>({from:`福建市舶太监 高寀`,title:`为市舶税务、乞归内监管理事`,summary:`市舶太监请将月港关税改由内监征收，径解内帑。`,body:`奴才谨奏：月港关税，现由福建布政司征收，解户部。

奴才在闽三年，见税关之弊：商船报关，胥吏索费，一船之税，入官者不过六成，余四成尽入私囊。此非独闽中，天下税关皆然。

奴才请将此项改归内监征收，岁解内帑。奴才不敢多取，只照旧额征足，则一年可多解银八千两 —— 这八千两，是胥吏吞掉的那些。

伏乞圣裁。`,piaoni:`着户部与福建抚按会议。`,secret:`他说「不敢多取」，可内监办税从没有只取旧额的。这八千两是饵，钓的是往后每年十几万。`,patience:5,yiEffect:{ledger:{taicang:4}},ignoredEffect:{},options:[{key:`give`,label:`准归内监`,note:`内帑多，户部少，外廷要闹`,effect:{ledger:{neitang:14,taicang:-10},metric:{guanfeng:-4,chaoshi:-3},flags:{tax_to_eunuch:1}}},{key:`keep`,label:`照旧归布政司`,note:`胥吏吞四成，但账在户部`,effect:{metric:{chaoshi:2},flags:{tax_to_eunuch:0}}}]}),{weight:0,cooldown:999,line:`st-kh2`,when:e=>N(e,`kaihai`)&&e.turn>=26}),qt=j(`zl-prince`,`urgent`,()=>({from:`襄王（藩府）`,title:`为宗禄折色、王府用度不敷、乞赐矜悯事`,summary:`宗禄改折银后，襄王府岁入减三成，王上疏泣诉。`,body:`臣（襄王）谨奏：臣府岁支禄米二万一千石，自改折银之后，每石折银五钱，是岁得银一万零五百两。

往时本色，米价每石七钱，是臣府岁入实一万四千七百两；今折五钱，是每岁少了四千二百两。此四千二百两者，是臣府三百余口人的口粮、府中仪仗、祭祀、修缮之费。

臣不敢怨朝廷。然臣闻河南一省岁入二百八十万石，宗禄需二百四十万石 —— 朝廷亦有朝廷的难处。

臣只求一事：臣府禄米，仍支本色，其余各府照折。臣愿以身当这个不是。`,piaoni:`着宗人府、户部会议。`,secret:`襄王这一本写得极聪明：他不争「都别折」，只争「我除外」。若准了他，其余二十几个王府明天就都递本子。`,patience:3,yiEffect:{ledger:{taicang:5},metric:{chaoshi:-2}},ignoredEffect:{metric:{chaoshi:-6}},options:[{key:`exception`,label:`准襄府支本色`,note:`一个人开了口子，二十几个人跟着来`,effect:{ledger:{taicang:-10},metric:{chaoshi:3},flags:{zonglu_exception:1}}},{key:`refuse`,label:`不许。法一立，王与庶人同`,note:`硬顶，宗室要记恨`,effect:{metric:{chaoshi:-5,guanfeng:3},flags:{zonglu_refused:1}}}]}),{weight:0,cooldown:999,line:`st-zl`,when:e=>N(e,`zonglu`)&&e.turn>=16}),Jt=j(`ks-riot`,`urgent`,()=>({from:`湖广巡抚`,title:`为矿徒聚众、地方汹汹事`,summary:`内监开矿，掘及民田庐墓，武昌、汉阳聚众数千。`,body:`臣谨奏：内官监奉旨开矿，于武昌、汉阳二府掘矿三十七处。

初时尚可，所掘多在荒山。至五月，掘及民田，又掘及民坟 —— 江夏县民某氏祖坟被掘，棺已见，其族聚二百人持械相拒，内监随行之人伤者七。

今两府聚众已数千，有「逐矿使」之谣。臣调兵三百弹压，兵亦不肯前 —— 那些兵，也是本地人。

臣请暂罢矿税，以息众怒。若必开，乞先禁掘坟、禁占田。`,piaoni:`着内官监严饬，毋得扰民。`,secret:`这道票拟是司礼监代批的。陈矩写「严饬」二字时，笔尖顿了一下——他知道这两个字对矿使毫无约束。`,patience:2,yiEffect:{metric:{minxin:-3},ledger:{neitang:3}},ignoredEffect:{metric:{minxin:-12,chaoshi:-6},ledger:{neitang:5}},options:[{key:`stop`,label:`罢矿税`,note:`内帑断了一项进项，民心回来一些`,effect:{statutes:{kuangshui:!1},metric:{minxin:8,chaoshi:2},flags:{mine_stopped:1}}},{key:`restrict`,label:`只许掘荒山，禁及田墓`,note:`折中。矿使照旧有借口`,effect:{metric:{minxin:3},ledger:{neitang:-4},flags:{mine_restricted:1}}},{key:`suppress`,label:`调兵弹压，矿税照旧`,note:`压得下去。压下去之后呢`,effect:{metric:{minxin:-10,chaoshi:-4,guanfeng:-3},ledger:{neitang:8},flags:{mine_suppressed:1}}}]}),{weight:0,cooldown:999,line:`st-ks`,when:e=>N(e,`kuangshui`)&&e.turn>=24}),Yt=j(`tz-silence`,`routine`,()=>({from:`吏部尚书`,title:`为言路壅塞、科道缺员、乞赐简补事`,summary:`廷杖之后，六科给事中缺员过半，无人敢补。`,body:`臣谨奏：六科给事中额设五十八员，今在任者二十四员。

缺员之故，非无才可选 —— 是无人肯来。前月廷杖三人，一人死于杖下，二人削籍为民。科道之职，本是「言事」；今言事者死，谁还肯做这个官？

臣曾以三人名上，三人皆辞。内一人回书曰：「家有老母，不敢以身试杖。」

言路无人，则天下之弊，无人上闻。此非臣之私忧。`,piaoni:`着吏部另行拣选。`,secret:`这本是谁递的？——是司礼监让吏部递的。张诚想让皇上知道：杖打完，没人说话了，连坏事也没人报了。`,patience:5,yiEffect:{metric:{chaoshi:-2}},ignoredEffect:{metric:{chaoshi:-5,guanfeng:-3},backlog:6},options:[{key:`pardon`,label:`起复被杖诸臣`,note:`认个错。士林会记这一笔`,effect:{metric:{chaoshi:9,guanfeng:4},flags:{tz_pardoned:1}}},{key:`fill`,label:`另择温顺者补足`,note:`有人说话了，说的都是好话`,effect:{metric:{chaoshi:-3},backlog:-4,flags:{tz_filled:1}}}]}),{weight:0,cooldown:999,line:`st-tz`,when:e=>N(e,`tingzhang`)&&e.turn>=12}),Xt=[j(`y11-impeach`,`impeach`,()=>({from:`云南道监察御史 羊可立`,title:`为追论故辅罪状、乞正国法事`,summary:`张居正身后被论十四罪，首及「诬蔑亲藩、侵占王坟」。`,body:`臣羊可立谨奏：故太师张居正，蒙先帝托孤之重，柄国十年。
