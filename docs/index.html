s,reputation:p,impressions:g,revealed:0,tenure:0,historical:!0,speech:Te[e]?.speech??`blunt`,privateLife:Te[e]?.life??`家世平常`,want:Te[e]?.want??`想升一级`}),Ee=[k(`zhangsiwei`,`张四维`,`子维`,`山西蒲州`,`嘉靖三十二年进士`,1526,`grand-1`,`晋党`,48,70,65,70,45,62,`蒲州人，世代盐商。由翰林历吏部侍郎、礼部尚书入阁。张居正当国时屈意事之，居正一死，他是第一个动手的人。`,`才识明练，然心机深密，好揽权。`,[`语声低缓，每句话都留三分余地。问他张居正，他只说「先太师功在社稷」。`,`提起考成法，他用了「苛」字，随即改口为「严」。这个改口，你记住了。`,`他说「天下事当与天下人共之」。这话很好听，也很空。`]),k(`shenshixing`,`申时行`,`汝默`,`南直隶长洲`,`嘉靖四十一年状元`,1535,`grand-2`,`无党`,72,76,58,72,72,78,`长洲人。状元及第，历翰林修撰、礼部右侍郎。为人蕴藉，善调停，朝中无党亦无仇。`,`老成持重，通达政体。然过于圆融，遇大事少担当。`,[`谈吐极雅。问他清丈之事，他讲了一段《周礼》。你听完了，仍不知道他的意思。`,`他说「法行而民不扰，方为善法」。听着温和，其实是说：张居正的法，扰民。`,`你不问他，他绝不先说。这样的臣子，不会给你惹祸，也不会替你挡祸。`]),k(`yuyouding`,`余有丁`,`丙仲`,`浙江鄞县`,`嘉靖四十一年进士`,1527,`grand-3`,`浙党`,65,74,61,68,66,64,`鄞县人。探花及第，历翰林、国子监祭酒、礼部侍郎。敏练明达，长于条陈。`,`才具敏练，条理分明。然气量稍狭，好与人争。`,[`说话极有条理，一二三四，从不含糊。`,`他算过一笔账：若把天下驿递裁去三成，一年可省银四十万。说完他自己补了一句：「不过这样要得罪很多人。」`]),k(`xuguo`,`许国`,`维桢`,`南直隶歙县`,`嘉靖四十四年进士`,1527,`grand-4`,`清流`,69,73,72,73,76,70,`歙县人。由翰林历詹事府詹事。刚直敢言，不避权贵，士林重之。`,`操守端方，敢任事。然性刚，不能容人。`,[`他进门时行的是常礼，不是大礼。你问他为什么，他说「臣是来议事的，不是来行礼的」。`,`谈到辽东，他直言「李成梁之功，半是报的」。说完也不看你。`]),k(`wangguanguang`,`王国光`,`汝观`,`山西阳城`,`嘉靖二十三年进士`,1512,`hubu-shangshu`,`江陵旧人`,62,84,82,84,58,68,`起家知县，历户部郎中、顺天府尹、户部尚书。在户部九年，天下钱粮出入皆能口诵，张居正倚之如左右手。为人峻急，好察。`,`综核精敏，钱谷第一。然性苛急，属吏苦之。`,[`奏对时条理极清，钱粮数目信口道来，无一处滞碍。这是个真会算账的人。`,`谈起清丈，他先说「各省有司苦之」，再说「然非此无以核田」。先把难处摆出来，是给自己留后路。`,`问户部现存银数，他答「三百七十余万」。答得太快了。`]),k(`liangmenglong`,`梁梦龙`,`乾吉`,`北直隶真定`,`嘉靖三十二年进士`,1527,`bingbu-shangshu`,`晋党`,63,75,72,74,62,66,`真定人。历顺天府尹、右副都御史巡抚山东、蓟辽总督、兵部尚书。谙熟边务，尤精海运。`,`明习边事，敢任劳怨。然与晋党相厚，其进不由正。`,[`谈边务如数家珍，哪一镇缺马多少，哪一处墙台该修，一一道来。`,`他提过海运。说「漕河一断，京师就饿死」。这话不吉利，但没人能驳他。`]),k(`shenli`,`沈鲤`,`仲化`,`河南归德`,`嘉靖四十四年进士`,1531,`libu2-shangshu`,`清流`,76,78,72,75,86,80,`归德人。由翰林历礼部侍郎、礼部尚书。学行醇正，为士林所宗，时称「归德沈公」。`,`学行兼备，操守甚严。可为师儒，未可当大任。`,[`他讲学不讲政。你问他国用，他说「国用不足，先在节用」。`,`临走时他说：「皇上，臣有一言。天下的事，坏在人人只说好。」`]),k(`hairui`,`海瑞`,`汝贤`,`广东琼山`,`嘉靖二十八年举人`,1514,`ducha-zuo`,`清流`,96,45,85,52,99,88,`琼山人。由南平教谕历淳安知县、户部主事、应天巡抚。上《治安疏》几死。刚峰之名，天下皆知。`,`清介绝俗，刚直不阿。然迂执不通时变，不可为政务之官。`,[` hou`,`边将`,78,96,92,96,68,92,`登州人。世袭卫指挥。练义乌兵，破倭于台州、福建、广东，大小八十余战未尝败。隆庆初调蓟州，总理练兵，筑空心敌台千二百座，边备为九镇之冠。`,`（武臣考语）谋勇兼资，治军严整，一时名将无出其右。`,[`他说话极快，一句接一句，没有一句是空的。`,`问及蓟镇兵额，他说「额三万，实一万八千」。说完看了你一眼。`,`他不谈功劳。谈了半个时辰，只谈一件事：马。`]),k(`lichengliang`,`李成梁`,`汝契`,`辽东铁岭`,`世袭铁岭卫指挥佥事`,1526,`zz-liaodong`,`边将`,38,88,80,88,40,74,`铁岭人。年四十始为参将，积功至辽东总兵，镇辽二十二年，先后奏斩首一万五千级，封宁远伯。`,`（武臣考语）骁勇善战，威震绝塞。然侈奢好货，功次多所虚冒。`,[`礼节极周，笑得极暖。你问他辽东的事，他先说皇上圣明。`,`他报的斩首数目，说得比户部的钱数还清楚。`,`他养着几个女真的少年，说「留着有用」。你问他有什么用，他说「哪天不听话了，就杀掉」。`]),k(`lirusong`,`李如松`,`子茂`,`辽东铁岭`,`父荫`,1549,`zz-xuanfu`,`边将`,68,90,89,90,55,72,`成梁长子。以父荫为指挥同知，历山西、宣府总兵。骁勇敢战，善用兵。`,`（武臣考语）英锐敢战，有父风。然骄纵，不循法度。`,[`他比他父亲直。你问边事，他一口气说到马料够不够。`,`他说「打仗不难，难的是打完了报账」。`]),k(`magui`,`麻贵`,`崇道`,`山西大同`,`世袭大同右卫指挥使`,1538,`zz-datong`,`边将`,69,84,82,83,62,68,`大同人。将门出身，历大同、宁夏、延绥总兵，果勇善战，为一时宿将。`,`（武臣考语）果毅有谋，驭军严明。`,[`他说话很慢，一句一句往外挤。`,`他说「大同的马，三年倒了一半。报上去的数是活的」。`]),k(`liuting`,`刘綎`,`省吾`,`江西南昌`,`父荫`,1558,`zz-yansui`,`边将`,62,86,90,88,40,62,`南昌人。将门子。所用镔铁大刀重百二十斤，马上轮转如飞，人称「刘大刀」。历云南、四川、延绥总兵。`,`（武臣考语）勇冠三军，所用兵号「刘家军」。然骄横不法，屡为言官所劾。`,[`他手上有刀茧，厚得像树皮。`,`他说「臣在云南杀过很多人」。你问多少人，他想了想说「记不清了」。`]),k(`dongyiyuan`,`董一元`,`子仁`,`北直隶宣府`,`世袭宣府前卫指挥使`,1532,`zz-guyuan`,`边将`,65,78,77,78,56,60,`宣府人。将门之后，历蓟州、宣府、延绥总兵，屡立战功。`,`（武臣考语）老成持重，不喜生事。`,[`他说「守边之道，一分靠兵，九分靠不惹事」。`]),k(`dayun`,`达云`,`腾霄`,`陕西凉州`,`世袭凉州卫指挥使`,1550,`zz-gansu`,`边将`,66,76,77,76,60,58,`凉州人。历西宁参将、甘肃总兵。勇悍善战，尤熟西陲夷情。`,`（武臣考语）骁勇有谋，抚御西番有方。`,[`他讲起青海的番部，谁跟谁有仇，谁能出多少兵，一清二楚。`,`他说「甘肃的边墙，修一次塌一次。钱花了，墙还在塌」。`]),k(`zhengluo`,`郑洛`,`子仁`,`北直隶安肃`,`嘉靖三十五年进士`,1530,`zongdu-xuanda`,`晋党`,67,80,77,78,70,72,`安肃人。历右佥都御史巡抚山西、宣大总督。俺答封贡、经略青海，皆与其谋。`,`沈毅有谋，长于抚驭诸夷。`,[`他见过俺答。他说那人「不像传说里的凶神，倒像个老农」。`,`他说「和虏和了十几年，边墙上的草都长出来了」。这句话里有点别的东西。`]),k(`xiaodaheng`,`萧大亨`,`夏卿`,`山东泰安`,`嘉靖四十一年进士`,1532,`zongdu-sanbian`,`晋党`,66,72,74,74,60,62,`泰安人。历大同巡抚、宣大总督、刑部尚书。久任边镇，熟知虏情。`,`谙练边务，持重不躁。`,[`他算过一笔账：宣大两镇，一年花银八十万，换的是「不出事」。他说这买卖不亏。`]),k(`wudui`,`吴兑`,`君泽`,`浙江山阴`,`嘉靖三十八年进士`,1525,`zongdu-jiliao`,`浙党`,56,72,66,70,55,60,`山阴人。历蓟辽总督、兵部尚书。俺答封贡之议，兑实主之。`,`通达事体，善与人交。然颇通苞苴。`,[`他说「边事有三样：钱、马、面子。三样都给了，就不打」。`]),k(`yemengxiong`,`叶梦熊`,`男兆`,`广东归善`,`嘉靖四 年起的差事，两年多了。各省报册按旬递到户部，户部按旬往上报一个数。`,"qz-m30":`清丈过了三成，头一批隐占的田浮出水面——浮出来的第一批，是藩府的庄田。襄王的庄田在河南、湖广两处，册子上记的是「钦赐」，实际丈下来，多出三倍。`,"qz-m55":`清丈过半，苏松常镇四府的乡绅坐不住了。这四府是全国赋税最重的地方，也是田产最集中的地方。`,"qz-m90":`各省报竣，田册堆在户部。按例该遣官抽验，可验一回要一年、要八万两。户部想直接奏销。`,"fb-impeach":`冯保掌司礼监十年，批红的笔一直在他手里。张居正活着的时候，两个人是一体的：外廷的票拟出自张居正，内廷的朱批出自冯保。如今张居正死了半年，冯保一个人站着。`,"fb-panic":`冯保籍家之后，内廷十二监四司八局，称病告假的三十多人。他们不是冯保的党，是怕。`,"fb-plot":`东厂报上来一份名单：冯保到南京之后，还有七个人给他递过信。其中有一个，是张四维的门生。`,"kc-debate":`考成法是万历元年颁的：每件事立程限，三本账簿层层查考，征赋不足九成者罚。十年下来，政令「虽万里之外，朝下而夕奉行」——代价是州县官不敢报灾。张居正一死，朝中要求宽考的声浪就起来了。`,"kc-loose":`宽考的诏下去三个月。州县不必再怕降级，催科的劲就松了——松的是催科，紧的是国库。`,"kc-harsh":`考成照旧，征赋不足九成一律降三级。这条规矩在万历四年定下时，没人觉得会出人命。`,"settle-zhang":`张居正死后半年，弹劾的奏本一天比一天多。先是说他「夺情起复、忘亲贪位」，再是说他「结党营私、压制言路」。这些话都不新鲜——真正要命的是另一句：他家在江陵，田产万顷。清算一个权臣，从「擅权」入手难，从「赃私」入手容易。`,"y11-impeach":`张居正死后半年，弹劾的奏本一天比一天多。先说他「夺情起复、忘亲贪位」，再说他「结党营私、压制言路」。这些话都不新鲜——真正要命的是另一句：他诬蔑辽王，夺了人家的府第。清算一个权臣，从「擅权」入手难，从「欺宗室」入手容易。`,"y11-raid-home":`籍没的旨意是六月下的。荆州知府带人封了张府的门，不许人出入，等着京里派的官来点验。这一等，等了两个多月。`,"y11-jianzhou":`建州左卫在辽东边外，自永乐年间设卫，世袭都指挥使。努尔哈赤的祖、父都做过官军的向导，死于兵。他今年二十五岁。辽东报上来说「不过一部酋耳」——这话往年也说过，说过王杲，说过王台。`,"y11-kaocha":`六年京察，例在辰戌丑未年。今年辛未，正届期。上一次京察是万历五年，那时候张居正当国，去留全凭他一句话。如今他死了，这一届由谁来定人去留，是朝中眼下最要紧的一件事。`,"y11-river":`潘季驯治河三年，高家堰是全部工程的关键：堤成则淮水不出，淮不出则黄不倒灌，运道可保。堤已筑了九分。他知道户部不肯给钱——前年他上疏要帑，被驳回过一次。`,"y12-hairui":`海瑞闲居了十三年。张居正当国时，最忌的就是这种「清名满天下、又不肯低头」的人，几次有人荐他，都压着不用。如今张居正死了两年，荐牍上又有他的名字。`,"y12-salt":`两淮盐课是天下盐课之半，可这半已壅了十年。引照样在发，盐照样在私卖，只有边镇的粮仓一年比一年空。占着引窝的，是几家开国勋贵的后人。`,"y12-altan":`隆庆五年封俺答为顺义王，开马市，宣大从此无边警十三年。如今俺答老了，部里的事是他妻子三娘子在管。她要名分，也要实惠。`,"y13-drought":`京畿自二月不雨。三月的报册还写「可望雨泽」，五月的报册写「麦尽枯」。城外粥厂的米，是顺天府自己垫的，垫到五月，府库也空了。`,"y13-purge":`去年京察去了二百三十七人。被黜的人没有申诉的路——京察的结论是「考察」，不是「论罪」，所以不须证据。顾宪成想争的，就是这一点。`,"y13-liaodong":`辽东的屯田册子上有五万七千顷，实际能收粮的不足八千。中间的差额，一半在逃军的名字底下，一半在将领的私囊里。`,"y14-guoben":`皇长子五岁，中宫无出。皇三子刚生，其母郑氏即进封皇贵妃，位在皇长子的母亲之上。这一步走得太明白了，明白到朝里没有人看不懂。`,"y14-petition":`请立东宫的折子递了三次，降调了四个人。第四次是一个刑部主事递的——官不大，话说得最狠：「若臣言不当，请先赐臣死。」`,"y14-nihon":`日本的事，靠朝鲜的使臣传话。对马岛离釜山五十里，消息要到辽东，再转到京师，前后两个月。等你知道，事情已经发生过了。`,"y15-hairui":`海瑞在南京做右都御史两年，上过一道疏，说「陛下励精图治，而治化不臻者，贪吏之刑轻也」。这道疏递上去，没人接话。`,"y15-qijiguang":`戚继光镇蓟十六年，修空心敌台一千二百座，练车营，蓟门晏然。张居正一死，弹章就来了——理由是「久任不迁」，这四个字不算罪，可也不算清白。`,"y15-jingying":`京营的册子上有十一万七千兵。这册子二十年没变过，因为变一次，就要有人交出吃了二十年的空饷。`,"jz-merge":`建州左卫自永乐年间设，世袭都指挥使。努尔哈赤起兵时只有十三副遗甲，两年并了三部。辽东的奏报一直说「一部酋耳」——这话在王杲身上说过，在王台身上说过，每一次都说对了。`,"jz-city":`万历十一年的奏报说建州「不过数百」。十五年，费阿拉城内城三层、外城五里。四年间，辽东换了三任巡抚，每一任都上过疏，每一份疏都用了「相机」两个字。`,"qz-final":`清丈从万历八年办到十三年，五年。王国光在户部九年，这件事是他一手办的。账做完了，他上疏乞休 —— 他知道这本账刊出去，得罪的人会记他一辈子。`,"fb-after":`冯保去后，司礼监掌印的位子空了半个月。批红的笔没人执，内阁的票拟堆在文书房，一道也发不下去。内廷八位秉笔，人人都在等。`,"fb-corrupt":`新掌印上任一年，内帑的簿籍第一次对不上。这事在冯保身上发生过，冯保的下场是发去南京种菜。可这一次，劾本递上来，恰好落在被劾的人手里拟旨。`,"kc-loose-end":`宽考一年。州县不必再怕降级，催科的劲就松了 —— 松的是催科，紧的是国库。户部现在只有两个办法：加派，或者借支。两个都不是好办法。`,"kc-harsh-end":`沂州今年报完九成一。这个数字刚好过关，也刚好说明问题：九成一里有三成是挪借的，一成是胥吏垫的，真正出于民的不过五成。`,"purge-backlash":`朝中没有人是孤身一人的。一个人的去留，往后牵着一串人：同年的、同乡的、同门的。所以罢一个人，从来不是罢一个人。`,"raid-alert":`察哈尔土蛮部自去年起就在锦义一带试探，先劫边堡，再掠屯田。边将报的是「小警」，按例不必上闻——这一次成规模了，才报到御前。`,"frontier-pay":`九边年例银岁额三百多万两，本年解到一半。欠的那一半，户部的说法是「各省逋欠未到」，兵部的说法是「户部扣着不放」。边军看到的只有一样：饷没到。`,mutiny:`饷欠七个月。这在九边不算新鲜事——宣大欠过十个月，辽东欠过一年。这回闹起来，是因为坐营官当着军士的面，把最后一批饷银扣下了一半。`,"hubu-routine":`太仓的账，一旬一报。入的比出的少，这个缺口已经连着报了七旬。`,"neifu-ask":`慈宁宫西配殿的梁是嘉靖年间的旧料，今年三月发现朽了。工部估过价，可户部说太仓不足。圣母还住在里头。`,arrears:`天下逋欠一百四十七万两。其中三成是灾伤蠲免，该蠲；剩下七成是拖欠——拖欠里又有真假两种。`,kaikuang:`太仓连年支绌，内官监提了一个法子：开矿。本朝开过，前朝也开过，每次开完，地方上都要闹几年。`,caoliang:`漕河自济宁以北水浅，粮船堵了一千二百只。这是今夏第三回堵，前两回靠降雨解的围。`,tingtui:`位子空了，按例要会推。会推的名单是吏部拟的，九卿科道画圈——你能选的只有圈上的三个人。`,kaoman:`三年一次的考察。名单是吏部考功司拟的，拟的时候有人来打招呼；挡不住的那几个，郎中在名字旁边画了圈。`,dingyou:`郑洛任宣大总督三年。去年俺答的孙子扯力克与三娘子争位，宣大口外诸部骑墙观望，全靠郑洛压着。他一走，这摊子要重新捋。`,"tribute-arrive":`朝鲜例贡一年一次。今年的使团四十七人，走的是辽东陆路——往年走海路，今年海上有警。`,"market-ask":`俺答封贡是隆庆五年的事，到今十二年。马市一年两回，边墙上的草长起来了，宣大的兵也松了。`,"vassal-plea":`日本关白丰臣秀吉去年平定九州，今年初调兵到对马岛。朝鲜的使臣是走海路来的，路上走了二十天。`,"tusi-rebel":`播州杨氏从唐朝据有此地，八百年。杨应龙袭职十一年，修海龙屯、养苗兵，贵州报过三次，四川都压下去了。`,drought:`山东自三月不雨。四月的报册写「雨泽调匀」，六月的报册写「禾苗尽枯」——中间隔了两个月，是县里压着不报。`,flood:`高家堰是淮扬七州县的命。万历六年潘季驯主持修筑，束水攻沙，保了五年。今年伏秋的汛比往年大。`,"locust-plague":`河南先旱后蝗。蝗是从北边飞来的，起于大名，过黄河，落开封。旱灾之后必有大疫，这是老规矩。`,earthquake:`京师地震，声自西北来。钦天监的占书说「臣道太盛」——这话在张居正死后第二年说，意思很清楚。`,"salt-tax":`两淮盐课是天下盐课之半。盐引壅积一百二十万道，商人不肯中，课银就收不上来。`,weaving:`苏杭织造是内廷的差事，太监领银、机户织造。上用缎匹原额一万匹，今年不够用。`,exam:`本科会试，天下举人四千六百人入场，取中三百五十名。殿试只定甲第，不落一人。`,"clan-stipend":`河南一省岁入二百八十万石，宗禄需二百四十万石。这个数已经撑了二十年，今年撑不住。`,vagrant:`荆襄山中的流民是成化年间留下的老问题。那一年驱还本籍，杀了十几万。今年又聚了二十几万。`,armory:`京营军器十年没晒过。盔甲三千副可用者九百，弓箭五万支可用者一万二，火器炸过三门。`,recommend:`荐举是祖宗的旧制：大臣荐举、吏部查议、皇帝简用。问题是荐举的人大多荐自己的门生。`,auspice:`祥瑞是历代都有的东西。一茎九穗的嘉禾、白鹿、甘露——报上来的人要的是赏，不是信。`,"open-ytb":`一条鞭在江西、浙江试了几年，是有效的：赋役归并，胥吏少了一道手脚。南直隶却一直没动——这里的田最肥，乡绅也最硬。应天巡抚到任两年，翻过苏州一府的鱼鳞册，翻完就没再说话。`,"open-kh":`隆庆年间开过一次海，开了不到两年又关上。关的理由不是海寇，是福建卫所的上书：「海防自此坏矣」。如今换了个巡抚，同一本子又递上来。`,"open-zl":`宗禄是明朝财政上的一块烂疮。太祖定下的规矩，朱家子孙都要养；到万历年间，在册宗室已逾十万。山西一省钱粮，宗禄占去大半，藩司库里常是空的。`,"open-ks":`开矿抽税这事，嘉靖朝就有人提过，压下去了。如今太仓见底，提的人换成了内官监——他们要的不是国用，是「径解内帑」这四个字。`,"open-tz":`廷杖是祖宗的旧例，用过，但用得不多。都察院左都御史这本写得极小心：他不请用杖，只说「不敢不奏」。`,"rep-kaocheng":`考成法是万历元年立的：立程限、置三簿、逐月查考。十年下来政令确实快了，州县官的怨也积了十年。吏部每年把账报一次，报的是降了几员、清了几件。`,"rep-ytb":`一条鞭真正落地，靠的不是诏书，是每旬解到的银子。户部按季报账——报到你案上的，是折银之后的数，不是百姓手里的数。`,"rep-kh":`月港关税，一半解太仓，一半留福建。留在福建的那一半，从来没有人查过账。`,"rep-zl":`宗禄改折之后，山西藩司的库房头一回没有向户部告匮。王室的怨，也在这一年里一点点积起来。`,"rep-ks":`矿税的特别处：钱不进户部的账，进内帑。所以这笔账只有内官监自己清楚——他报多少，就是多少。`,"rep-tz":`廷杖之后，六科的位子空了一半。吏部挑人挑不出来：不是没人，是没人敢来。`,"open-yanfa":`开中法坏了二十年：盐引先被边将截了，再转给京里的势要，商人算过账，不如在扬州买引。边镇的粮仓，就这样一岁一岁空下去。`,"open-caozhe":`漕粮四百万石，一石到京要三石之价 —— 这是天下最贵的一条路。户部算了十年这笔账，只是没人敢在纸上写「改折」两个字。`,"open-haiyun":`运河二百年了。挑浅的银子一年几十万，只保得半年。前元的海运旧道还在，只是没有人愿意担「漂没」这两个字。`,"open-mazheng":`民牧之苦，做外官的人都见过：一户养一马，马死则赔，一马之累，破一家之产。太仆寺的库银，却常年被兵部借着不还。`,"open-juanmian":`河南的积欠已经记了十年。册上的人早就逃了，追比却追到里长头上 ——今年杞县有一个里长，自缢在县门口。`,"open-jiapai":`九边欠饷，兵部一天三道咨文。户部算到最后，库里只剩三万两 ——加派这两个字不好看，可下个月的饷总得有个出处。`,"open-rongyuan":`两京添设官三百余，各省闲住佐贰以千计。这些人不干事，却要吃俸；一岁俸禄六十万，去其三分之一，正好是九边一个月的年例。`,"open-caiyi":`天下驿站岁费三百万，是太仓岁入的四分之三。勘合滥发，飞票遍地 ——一张纸就能支夫十名、马五匹。`,"open-qingjun":`辽东额兵八万，实额不足六万。空出来的两万人的饷，各级将官分；辽东总兵去年在京师买了两处宅子。`,"open-shangtun":`宣大关外千里荒地。国初军屯自给，如今屯田尽废，全靠太仓发银买粮 ——银子出关，粮价就由商人说了算。`,"open-jingying":`京营十二万的册子，点过两回：第一回五万，第二回三万七千。来的人里能披甲的不到一半 —— 军户雇人应点，一人一旬一钱银。`,"open-neicao":`京营点卯不足四万，宫里总得有些能动手的人。这本是司礼监递的，「以备非常」四个字写得含糊，含糊得让人不安。`,"open-jiangxue":`书院禁了四年，禁而不绝：改在寺庙、在私宅，反而更不受管。士子只读程文，学问日陋 —— 这是礼部看得见的。`,"open-jinjiangxue":`书院拆了，讲学的人还在讲；讲完写成书，刻出来卖，天下的士子都读。首辅真正怕的不是讲学，是那些书。`,"open-xianfeng":`宗室在册逾十万，岁支禄米八百五十万石 —— 天下税粮的三分之一。《皇明祖训》就摆在奉天殿上，没有人敢先开口。`,"zl-refuse":`宗禄折色、限封降等，两条法下去，藩府最先做的不是递本子，是关门：粮册不交、庄田不丈、命官不见。地方官进不去，丈量的人下不了绳。`,"zl-petition":`宗室越关赴京是要掉脑袋的事，他们还是来了 —— 带的是《皇明祖训》，不是兵器。这一本最难办：拿人是不孝，不拿是无制。`,"zl-union":`一个藩王上书，朝廷可以不理；四个藩王联名、宗室四百余人署名，这就是另一件事了 —— 它不再是请求，是态度。`,"zl-guards":`亲王的护卫，嘉靖以后就裁尽了。代府养八百家丁，说是「护府」，地方官心里明白：这是私兵。可谁去缴？河南都司的兵，不敢进府城。`,"no-rain":`雨泽旬报是户部的常课：每旬各省报雨，报的是水旱，也是年成。`,"no-grain":`漕粮与月粮解到太仓，是户部每月都要报的一笔账 —— 账上从来没有短少。`,"no-horse":`太仆寺管马政：倒毙、买补、孳生，一年到头都是这些事。`,"no-river":`高家堰岁修是河工的常例：不修，秋汛就决口；修了，也只有半年安稳。`,"no-tribute":`属国朝贡是礼部的门面：一年几回，费不多，但不能没有。`,"no-appraisal":`各省考语按月送到吏部，是三年考察的底账。看与不看，账都在。`,"no-justice":`秋审重囚，勾决与否，是皇帝每年要亲手做的一件血事。`,"no-weaving":`苏杭织造是内廷的差事：上用缎匹，一年几回，机户三百家。`,"touxian-open":`投献不是新事，是二百年来的老病：田挂到优免之家，赋役就凭空消失。清丈之所以难，难在你白天丈出来的田，他晚上就改了姓。`,"touxian-spread":`到后来，一县的田半在藩府。册上的数与实征的数，差出三成 ——这在明代财政史上，是最安静的一场溃败。`};function mt(e){return pt[e]}var ht=8,gt=0;function _t(e,t){if(e.when&&!e.when(t)||e.once&&(t.flags[`tpl_${e.id}`]??-999)>-999||e.requires&&!e.requires.every(e=>(t.flags[e]??0)>0)||e.forbids&&e.forbids.some(e=>(t.flags[e]??0)>0))return!1;let n=t.flags[`tpl_${e.id}`]??-999,r=e.cooldown??ht;return t.turn-n>=r}function vt(e,t){let n=e.flags[`reps_${t}`]??0;return n===0?1:Math.max(.12,.55**n)}function yt(e,t){if(t===1)return e;let n=e=>e!==void 0&&e>0?Math.max(1,Math.round(e*t)):e,r={...e};return e.taicang!==void 0&&(r.taicang=n(e.taicang)),e.neitang!==void 0&&(r.neitang=n(e.neitang)),e.taipu!==void 0&&(r.taipu=n(e.taipu)),e.ledger&&(r.ledger={taicang:n(e.ledger.taicang),neitang:n(e.ledger.neitang),taipu:n(e.ledger.taipu)}),r}function bt(e,t){let n=jn[t];if(!n||n.when&&!n.when(e)||n.once&&(e.flags[`tpl_${n.id}`]??-999)>-999||n.requires&&!n.requires.every(t=>(e.flags[t]??0)>0)||n.forbids&&n.forbids.some(t=>(e.flags[t]??0)>0))return null;let r=vt(e,t),i=n.build(e);gt+=1;le 。着各抚按用心查核，毋得虚应故事。`,secret:`这道票拟是张四维拟的。他批「毋得虚应故事」六个字，可他山西老家的田，正是丈得最慢的一处。`,yiEffect:{project:{id:M,progress:1.6,reported:3.4}},patience:5,ignoredEffect:{project:{id:M,progress:-1.2,resistance:3},log:`清丈题本压在案上没动。各省等不到回话，丈量的渐渐停了。`},options:[{key:`yi`,label:`依拟`,effect:{project:{id:M,progress:1.6,reported:3.4}}},{key:`qian`,label:`再发工食银十五万两`,needsReading:!0,note:`丈量要人、要纸、要饭。不给钱，州县只能摊派到百姓头上`,effect:{taicang:-5,project:{id:M,progress:4,reported:5,resistance:-6},metrics:{minxin:2},energy:-1,log:`发太仓银十五万两充清丈工食。州县不必再摊派，怨声稍息。`}},{key:`cui`,label:`限三月报竣，逾期者参奏`,needsReading:!0,note:`张居正的路子。快，但会逼出假账`,effect:{project:{id:M,progress:5,reported:11,resistance:7},metrics:{guanfeng:2,minxin:-2},flags:{qingzhang_harsh:1,qz_known:1},energy:-1,log:`严旨切责清丈，限三月报竣。报册如雪片一般飞进通政司。`}},{key:`ba`,label:`罢了这差事，照旧额征收`,needsReading:!0,note:`张四维想听的就是这句。说了，清丈就废了`,effect:{project:{id:M,status:`failed`,resistance:20},metrics:{minxin:4,guanfeng:-4,chaoshi:2},flags:{qingzhang_abandoned:1},energy:-1,log:`诏令清丈照旧额征收，不必苛求。天下州县，如释重负。`}}]}},{line:`qingzhang`,weight:3,cooldown:8,sets:[`qz_open`],when:e=>!e.flags.qz_open}),wt=j(`qz-secret`,`urgent`,e=>{let t=e.projects.find(e=>e.id===M),n=Math.round(t?.progress??0);return{from:`巡按直隶监察御史（密奏）`,title:`为密陈清丈虚饰事`,summary:`臣亲验田册三十七处，真数视所报不及四成。此系密封，乞御览后焚之。`,body:`臣谨密奏。这一本，臣不敢发抄，不敢叫人看见。

臣走了大名、广平、顺德三府，亲手抽丈了三十七处。看到三样东西，叫臣心里发凉：

一、各县报的顷亩，多半是照旧额抄一遍，末了加个零头，凑个好看。
二、有些册子上田连阡陌，臣照着去量，荒草没人，连牛都进不去。
三、臣问一个知县，为什么不上实报。他跪下来，说：「老爷，报了实，小的立刻革职；报个虚的，将来查出来，也不过是革职。左右是个革职，小的总想多捱两年。」

臣算了一遍：如今户部题报的是${Math.round(t?.reported??0)}分，臣抽验下来，实不过${n}分。\n\n臣不敢说这是哪一个人的罪。这是法的毛病，不是人的毛病。太急，就假。\n\n伏乞圣明裁察。`,piaoni:`密奏留中，不必发抄。`,secret:`这本疏没有经过内阁。是巡按直封进宫的——也就是说，写这本的人没打算升官。`,yiEffect:{project:{id:M,expose:!0},flags:{mizou_seen:1},log:`密奏留中。你现在知道那个数是假的了。`},patience:8,ignoredEffect:{project:{id:M,resistance:5},flags:{mizou_seen:1,qz_cover:1},log:`密奏压在案头没看。那位御史后来调走了，走之前没再说一句话。`},options:[{key:`yi`,label:`依拟（留中不发）`,effect:{project:{id:M,expose:!0},flags:{mizou_seen:1,qz_cover:1},metrics:{guanfeng:-2},log:`密奏留中。你知道了这个数，然后什么也没做。`}},{key:`cha`,label:`密令各省巡按据实覆核`,needsReading:!0,note:`把假的推倒重来。清丈要再拖一年`,effect:{taicang:-10,project:{id:M,expose:!0,reported:-Math.max(0,Math.round((t?.reported??40)-(t?.progress??0)-6)),resistance:9},metrics:{guanfeng:4,minxin:-2},flags:{mizou_seen:1,qz_reset:1},energy:-1,log:`密令各省巡按据实覆核。三个月后报册回到案头，数字少了近一半——这一回大概是真的。`}},{key:`zhao`,label:`召王国光来问`,needsReading:!0,note:`他是承办的人。你要看看他的脸`,effect:{project:{id:M,expose:!0,resistance:3},flags:{mizou_seen:1,qz_ask:1},energy:-3,log:`召户部尚书王国光问清丈的事。他跪了很久，才开口：「臣也知道。可皇上，臣要是一句一句往上报，这差事当天就办不下去。」`}}]}},{line:`qingzhang`,requires:[`qz_open`],cooldown:999,forbids:[`mizou_seen`]}),Tt=j(`qz-reset`,`project`,()=>({from:`南直隶巡按御史`,title:`为清丈激变、士民鼓噪事`,summary:`覆核田亩，触动乡绅。徽州、宁国二府士绅闭城罢市，呈文告御状。`,body:`臣谨奏：覆核的令一下来，出了事。

徽州、宁国两府，乡绅聚了三百多人，把府衙围了。他们说：田是祖宗传下来的，凭什么重新丈？有的把田契烧在衙门口，有的把大门锁了，罢市三天。

带头的几个人，臣查了，两个是举人，一个是退休的知府。他们不是乱民，他们是有功名的。

臣若拿人，就是与士林为敌；臣若不拿，摊子就散在这两府。

伏乞圣裁。`,piaoni:`着抚臣抚谕，不必深究。`,secret:`「不必深究」四个字，是申时行加的。他怕的是激出大乱子——可他也知道，这一让，覆核就覆不下去了。`,yiEffect:{project:{id:M,progress:-3,resistance:6},metrics:{minxin:2,guanfeng:-3},log:`诏抚谕徽宁士绅，不必深究。覆核之事，缓了下来。`},patience:4,ignoredEffect:{metrics:{chaoshi:-3,minxin:-4},project:{id:M,progress:-5},log:`徽宁士绅的事没人管。两府的田册，原样封存，再没人动过。`},options:[{key:`yi`,label:`依拟（抚谕，不深究）`,effect:{project:{id:M,progress:-3,resistance:6},metrics:{minxin:2,guanfeng:-3},log:`抚谕徽宁士绅。覆核缓了下来。`}},{key:`na`,label:`拿为首的三人，解京问罪`,needsReading:!0,note:`一刀切下去。切得断，也切得疼`,effect:{project:{id:M,progress:4,resistance:10},metrics:{guanfeng:4,chaoshi:-5,minxin:-3},flags:{scholar_anger:1},energy:-1,log:`拿徽宁士绅为首三人解京。天下士人哗然，说朝廷与读书人为难。`}},{key:`fen`,label:`分而治之：只查大户，免小户`,needsReading:!0,note:`把多数人摘出来，只跟最富的几家过不去`,effect:{project:{id:M,progress:2,resistance:-4},metrics:{minxin:4,guanfeng:1},energy:-1,log:`令只查田过千亩者，小户免丈。徽宁的围解了，几家大族的田册被抬进了衙门。`}}]}),{line:`qingzhang`,requires:[`qz_reset`],cooldown:999}),Et=j(`qz-ask`,`personnel`,()=>({from:`户部尚书 王国光`,title:`为奉职无状、乞赐罢黜事`,summary:`臣办清丈二年，不能使下无虚饰，此臣之罪。乞罢臣职，以谢天下。`,body:`臣王国光谨奏：臣请辞。

清丈办了两年，报上来的是八成，实数是四成。臣是承办的人，臣不能推给别人。

臣不是不知道底下作假。臣知道。可臣若一个个查，这差事十年也办不完；臣若不查，就是欺君。臣夹在中间，两年了。

臣今年七十一。臣想歇了。

伏乞皇上允臣致仕。`,piaoni:`王国光老成练达，着慰留，不必再辞。`,secret:`拟这道票拟的是张四维。他一边慰留王国光，一边已经在物色接任的人——户部这个位子，他想要。`,yiEffect:{metrics:{chaoshi:1},log:`慰留王国光。他没再辞。`},patience:5,options:[{key:`yi`,label:`依拟（慰留）`,effect:{metrics:{chaoshi:1},flags:{wang_stay:1},log:`慰留王国光。他叩了头，没再说话。`}},{key:`fang`,label:`准其致仕，另简能员`,needsReading:!0,note:`放他走。户部换个主，清丈也就换个命`,effect:{appoint:{officerId:`wangguanguang`,officeId:null},project:{id:M,progress:-6,resistance:4},metrics:{guanfeng:-2,chaoshi:-2},energy:-1,log:`准王国光致仕。他出京那天，户部的属吏送到城外。`}},{key:`ze`,label:`不准辞，且责其二年之欺`,needsReading:!0,note:`骂他一顿，让他戴罪办事。他会记住这一刻`,effect:{project:{id:M,progress:6,resistance:8},metrics:{guanfeng:3,chaoshi:-3},flags:{wang_ashamed:1},energy:-1,log:`不准辞，切责其二年虚饰之罪。王国光免冠叩首，额上见了血。此后三个月，他亲自下到顺天府抽丈。`}}]}),{line:`qingzhang`,requires:[`qz_ask`],cooldown:999}),Dt=j(`fb-impeach`,`impeach`,()=>({from:`江西道监察御史 李植`,title:`为劾奏权珰不法、恳乞乾断事`,summary:`劾司礼监掌印太监冯保十二大罪，请下法司逮问、籍没家产。`,body:`臣李植谨奏：臣要参一个人。

司礼监掌印太监冯保，伺候过三朝，掌着批红的笔，掌着东厂的缉事。二十年了。臣说他十二桩罪，桩桩都有实据：一、私藏御用之物；二、家里金银过百万；三、卖官；四、侵盗内帑；五、假传旨意害人；六、结党；七、纵容家奴占人田产；八、蒙蔽圣聪；九、紊乱朝纲；十、交通边镇；十一、怨望君父；十二、欺凌百官。

臣是个七品官。臣说这些话，是拿这条命在说。

臣请皇上大奋乾断，将冯保下法司逮问，籍没家产，以正国法。`,piaoni:`冯保是先帝留下来的人，伺候多年。说办就办，怕伤了先帝知人的明。拟交部院议处。`,secret:`这道票拟是张四维的手笔。他恨冯保很久了——但更要紧的是，他知道冯保一倒，司礼监的位子就空出来了。`,yiEffect:{metrics:{chaoshi:-3,guanfeng:-2},flags:{fb_alive:1},log:`李植劾冯保，交部院议处。议了三个月，没议出结果。`},patience:2,ignoredEffect:{metrics:{chaoshi:-5,guanfeng:-3},flags:{fb_alive:1},log:`劾冯保的疏留中不发。冯保照旧掌印，李植被罚俸三月。`},options:[{key:`yi`,label:`依拟（下部院议处）`,effect:{metrics:{chaoshi:-3,guanfeng:-2},flags:{fb_alive:1},log:`交部院议处。天下人都在等，等来等去，等到一道温旨。`}},{key:`ji`,label:`即下诏逮问，籍其家`,needsReading:!0,note:`这本疏，你等了很久了`,effect:{taicang:105,metrics:{chaoshi:-7,guanfeng:5,minxin:3},flags:{fb_dead:1},energy:-1,log:`诏逮冯保，籍其家。金银一百余万两，珠宝堆了一院子。发南京孝陵种菜。内廷上下，一夜之间都老实了。`}},{key:`jiang`,label:`降为奉御，发南京闲住`,needsReading:!0,note:`留他一条命。宦官会记住这份恩，也会记住这份怕`,effect:{taicang:38,metrics:{chaoshi:2,guanfeng:1},flags:{fb_exiled:1},energy:-1,log:`降冯保为奉御，发南京闲住。家产籍没三分之一。`}}]}),{line:`eunuch`,when:e=>e.date.year===1582&&e.date.month>=11,cooldown:999,once:!0,sets:[`fb_charged`],forbids:[`fb_charged`]}),Ot=j(`fb-panic`,`routine`,()=>({from:`司礼监秉笔太监 张诚`,title:`为内廷惊惧、乞示宽旨事`,summary:`冯保既籍，内臣人人自危。掌印以下，多有称病不出者。`,body:`奴才张诚谨奏：冯公公的事办完，内廷就乱了。

十二监四司八局，这几天称病告假的，有三十多人。不是真病，是怕。他们想，冯公公掌印二十年都办了，我们算什么。

奴才不敢替他们求情。奴才是想说一句：这些人里头，有的是冯公公的党，有的是跟了冯公公三十年、端过他茶碗的。可也有的，什么都没干过，就是怕。

请皇上下一道旨，说一句宽心的话。这一句，比发多少银子都管用。`,piaoni:`着司礼监晓谕，安心供职，不必惊疑。`,secret:`张诚自己就是最怕的那一个。他上这道疏，一半是为别人，一半是为自己探口风。`,yiEffect:{metrics:{chaoshi:3},log:`晓谕内廷安心供职。称病的陆续都回来了。`},patience:6,options:[{key:`yi`,label:`依拟（晓谕安心）`,effect:{metrics:{chaoshi:3},log:`晓谕内廷安心供职。`}},{key:`cha`,label:`趁势清查：凡冯保党羽，尽数革退`,needsReading:!0,note:`斩草除根。可内廷一空，谁替你批红`,effect:{taicang:18,metrics:{chaoshi:-6,guanfeng:2},flags:{eunuch_purge:1},energy:-1,log:`清查冯保党羽，革退内臣一百四十余人。内廷一时无人办事，批红积压了半个月。`}},{key:`liu`,label:`留几个能办事的，其余不问`,needsReading:!0,note:`内廷是个手艺活，换一批生手，你这个皇帝先受不了`,effect:{metrics:{chaoshi:5,guanfeng:-2},flags:{eunuch_kept:1},energy:-1,log:`只黜首恶数人，其余安心供职。内廷三日就恢复了旧样。`}}]}),{line:`eunuch`,requires:[`fb_dead`],cooldown:999}),kt=j(`fb-plot`,`impeach`,()=>({from:`东厂提督太监`,title:`为密陈外廷交通内臣事`,summary:`访得若干廷臣与南京闲住之冯保书信往来，谨密陈姓名。`,body:`奴才谨密奏：冯保到南京之后，还有人来往。

东厂访得，这两个月给他递过信的，有七个人。三个是外省的知府，一个是通政司的参议，两个是内官监的旧人。还有一个——奴才不敢写在这里，请皇上自己看附的名单。

奴才不是说他们要反。人倒了，还有人肯问候一句，这是人情。

可奴才的差事，是把这些事报上来。报上来，皇上心里有数；不报，奴才就是失职。`,piaoni:`知道了。名单留中。`,secret:`这份名单里，有一个是张四维的门生。东厂敢报，说明东厂背后有人撑腰——撑腰的人，正想动张四维。`,yiEffect:{metrics:{chaoshi:-1},log:`东厂密陈名单，留中。`},patience:6,options:[{key:`yi`,label:`依拟（留中）`,effect:{metrics:{chaoshi:-1}}},{key:`cha`,label:`按名单查办`,needsReading:!0,note:`顺藤摸下去。摸到谁，谁就倒霉`,effect:{metrics:{chaoshi:-6,guanfeng:3},flags:{eunuch_terror:1},energy:-1,log:`按东厂名单查办，革职五人，下狱二人。朝中一时人人自危，连内阁的票拟都变得极谨慎——凡有风险的事，一律拟「再议」。`}},{key:`shao`,label:`烧了名单，只诫东厂勿再缉访外廷`,needsReading:!0,note:`把刀收起来。可刀收起来，别人就会以为你不敢用`,effect:{metrics:{chaoshi:4,guanfeng:-2},flags:{factory_restrained:1},energy:-1,log:`焚东厂名单，戒其勿再缉访外廷。外廷闻之，颇有颂圣德者。`}}]}),{line:`eunuch`,requires:[`fb_exiled`],weight:2,cooldown:999}),At=j(`kc-debate`,`personnel`,()=>({from:`内阁首辅 张四维`,title:`为陈时政、乞宽考成事`,summary:`请将考成之法量从宽假：征赋以八分为率，违限者罚俸，勿遽降黜。`,body:`臣张四维谨奏：先太师当国十年，法度修明，这是他的功，臣不敢抹。

可是考成这一条，臣以为太急了些。如今是什么光景？州县官怕考成，怕到不敢报灾。报了灾就要蠲，蠲了就不够数，不够数就要降级。所以他宁可让百姓饿着，也要把数凑齐。

臣在下面待过，见过这样的县官：催科催到半夜，回到后堂，坐着哭。第二天接着催。

臣请把考成的规矩松一松：征赋以八分为率，违限的罚俸，不要动不动就降级调任。

法太紧，人就会说谎。这是臣这几十年看下来的。`,piaoni:`所奏深切时弊。着吏部、户部会看具奏。`,secret:`张四维要宽考成，一半是政见，一半是买人心。他刚接首辅，需要人说他好——而考成法，是最好的一份人情。`,yiEffect:{policy:{quota:80,severity:1},flags:{kc_loose:1},log:`诏宽考成：征赋以八分为率，违限罚俸。天下有司，如释重负。`},patience:6,ignoredEffect:{metrics:{chaoshi:-3,guanfeng:-1},flags:{kc_mid:1},log:`请宽考成的疏留中。张四维等了十天，没有再问。`},options:[{key:`yi`,label:`依拟（宽考成）`,effect:{policy:{quota:80,severity:1},flags:{kc_loose:1},log:`诏宽考成。天下有司如释重负，而考成之法，自此名存实亡。`}},{key:`bu`,label:`不许：先太师的法，不可轻改`,needsReading:!0,note:`你保住了这台机器。可是推这台机器的人，刚死了`,effect:{policy:{quota:90,severity:3},metrics:{chaoshi:-3,guanfeng:4,minxin:-3},flags:{kc_harsh:1},energy:-1,log:`诏：考成之法，祖宗成宪，不可轻改。张四维顿首称善，退朝时脚步很慢。`}},{key:`zhe`,label:`折中：九分为率，降黜改罚俸`,needsReading:!0,note:`谁都不得罪，也就谁都不满意`,effect:{policy:{quota:90,severity:2},metrics:{minxin:2,guanfeng:-1},flags:{kc_mid:1},energy:-1,log:`诏：考成以九分为率，违限者罚俸，不必遽降。`}}]}),{line:`kaocheng`,when:e=>e.turn>=6&&!e.flags.kc_loose&&!e.flags.kc_harsh&&!e.flags.kc_mid,cooldown:999}),jt=j(`kc-loose`,`urgent`,e=>({from:`户部尚书`,title:`为逋欠骤增、国用告急事`,summary:`考成既宽，各省拖欠银两激增。太仓见存${Math.round(e.taicang)}万两，不足以支边饷。`,body:`臣谨奏：宽考成的诏下去三个月，天下的逋欠就涨了。

各省报来，拖欠的银子，比去年多了六十万两。不是百姓不交，是州县不催了。州县为什么不催？因为催了也没人罚他。

臣不是说宽考成不好。臣是说：宽了之后，得有别的法子。

如今太仓见存${Math.round(e.taicang)}万两。下个月的九边年例，发不出去。`,piaoni:`着户部议措处之法。`,secret:`这道疏送到内阁，压了六天——张四维不想让它在你看到宽考成的坏处之前送到。`,yiEffect:{taicang:6,metrics:{minxin:-2},log:`户部议措处，加派六万两。`},patience:3,ignoredEffect:{taicang:-10,metrics:{bianfang:-4,chaoshi:-3},log:`逋欠的事没人管。边饷发不出，三个镇同时告急。`},options:[{key:`yi`,label:`依拟（户部议措处）`,effect:{taicang:6,metrics:{minxin:-2},log:`户部措处，加派六万。`}},{key:`jia`,label:`加派天下田赋，每亩三厘`,needsReading:!0,note:`钱能收上来。可你刚宽了考成，又加派，等于把好处收回去了`,effect:{taicang:24,metrics:{minxin:-8,chaoshi:-2},flags:{surtax:1},energy:-1,log:`加派天下田赋，每亩三厘，岁入增二十四万两。民间谓之「宽了考成，紧了口袋」。`}},{key:`nei`,label:`发内帑二十万两补边饷`,needsReading:!0,note:`你自己的钱。用了，就没有退路了`,effect:{neitang:-20,metrics:{guanfeng:4,chaoshi:3},flags:{neitang_used:1},energy:-1,log:`发内帑二十万两补边饷。户部尚书在文华门外跪谢，说「圣德」。`}},{key:`fu`,label:`恢复考成旧法`,needsReading:!0,note:`三个月前你刚宽了它。现在收回来，等于承认那道旨错了`,effect:{policy:{quota:92,severity:3},taicang:18,metrics:{guanfeng:6,minxin:-5,chaoshi:-4},flags:{kc_reversed:1},energy:-1,log:`诏复考成旧法。天下州县，一夜之间又变回了原来的样子。`}}]}),{line:`kaocheng`,requires:[`kc_loose`],cooldown:999}),Mt=j(`kc-harsh`,`urgent`,()=>({from:`吏部尚书`,title:`为县令自尽、士论沸腾事`,summary:`山东费县知县以征赋不足九分，闻将降黜，自缢于县衙。士林哗然。`,body:`臣谨奏：出了人命。

山东费县的知县，姓王，今年四十。考成核下来，他那一县征赋只完了八分六厘，差四厘。按新例，降三级调用。

他知道的那天晚上，把印挂在梁上，人吊在旁边。

他留下一张字条，说：费县今年旱，他蠲了三百户的税。蠲了就不够数。他说他不敢报灾，报了灾是「规避」，罪更重。

臣不敢说这道法不对。臣只是把这件事报上来。`,piaoni:`着有司优恤。其蠲免之事，查明具奏。`,secret:`吏部这道票拟写得很小心。他们不敢说「法太苛」，只敢说「优恤」——因为说前者，就是议你的政。`,yiEffect:{metrics:{guanfeng:-3,minxin:2,chaoshi:-2},log:`优恤费县知县。士论稍平。`},patience:4,ignoredEffect:{metrics:{guanfeng:-5,chaoshi:-4},log:`费县知县的事没有下文。此后半年，山东有四个知县告病，两个挂印走了。`},options:[{key:`yi`,label:`依拟（优恤）`,effect:{metrics:{guanfeng:-3,minxin:2,chaoshi:-2},log:`优恤费县知县。`}},{key:`gai`,label:`改例：灾伤蠲免者，不入考成`,needsReading:!0,note:`把制度的漏洞补上。可这么一补，又有人要钻`,effect:{policy:{quota:88,severity:2},metrics:{guanfeng:5,minxin:3,chaoshi:2},flags:{kc_fixed:1},energy:-1,log:`改考成例：灾伤蠲免者不入考成。天下州县闻之，多有泣者。`}},{key:`chi`,label:`斥其规避，着追夺诰命`,needsReading:!0,note:`人死了还要罚。这样的事，史书上会记一笔`,effect:{metrics:{guanfeng:-8,chaoshi:-5,minxin:-4},flags:{cruel:1},energy:-1,log:`斥费县知县规避考成，追夺诰命。士林大哗，有翰林作诗讽之。`}}]}),{line:`kaocheng`,requires:[`kc_harsh`],cooldown:999}),Nt=j(`settle-zhang`,`impeach`,()=>({from:`云南道监察御史 羊可立`,title:`为追论故辅罪状、乞正国法事`,summary:`劾张居正夺辽王府第、侵占王产，请追夺官爵、籍没家产。`,body:`臣羊可立谨奏：张居正死了快一年了。臣以为，有些账，该算了。

其一，他当国十年，威权震主。天下人只知道有首辅，不知道有皇上。
其二，他为了报私仇，把辽王废了，幽死在里头，辽王府的家产，进了张家的门。
其三，他三个儿子连科登第，占着高第，天下士人侧目而视，没有一个敢说话。
其四，他与冯保表里为奸，凡是要贬谁、要升谁，两个人关起门来就定了。

如今冯保已经伏罪。张居正的罪，难道就这么算了？

臣请追夺他的官爵，籍没他的家产，以正国法，以谢天下。`,piaoni:`张居正的功过，天下自有公论。这道疏说得过了，不准。`,secret:`拟这道票拟的是申时行。他知道拦不住——他只是想让自己在史书上留一句「曾为张居正说过话」。`,yiEffect:{metrics:{chaoshi:2,guanfeng:1},log:`羊可立论张居正，不准。言官议论纷纷。`},patience:4,ignoredEffect:{metrics:{chaoshi:-3,guanfeng:-2},log:`追论张居正的疏留中。言官愈发不平，弹章一天几本往上递。`},options:[{key:`yi`,label:`依拟（不准）`,effect:{metrics:{chaoshi:2,guanfeng:1},log:`追论张居正，不准。`}},{key:`ji`,label:`籍其家`,needsReading:!0,note:`抄一个死人的家。你会得到一些银子，和一段余生都要被提起的事`,effect:{taicang:22,metrics:{chaoshi:-9,guanfeng:-7,minxin:-2},flags:{zhang_ruined:1},energy:-1,log:`诏籍张居正家。得黄金二千四百余两，白银十万七千余两——不及冯保的十分之一。其长子敬修留血书自缢。家中老小封在府里，饿死十七口，中有婴儿三。消息传出，天下寒心。`}},{key:`xue`,label:`削其官爵、夺其谥，不籍家`,needsReading:!0,note:`罚他，但不砸他的家。这需要一点分寸，也需要一点胆`,effect:{metrics:{chaoshi:-2,guanfeng:-1,minxin:2},flags:{zhang_stripped:1},energy:-1,log:`诏削张居正官爵，夺谥，不籍其家。他母亲八十岁了，得终天年。`}}]}),{line:`zhang`,when:e=>e.date.year>=1583&&e.date.month>=3,cooldown:999,forbids:[`zhang_ruined`,`zhang_stripped`]}),Pt=[Ct,wt,Tt,Et,j(`qz-routine`,`project`,e=>{let t=e.projects.find(e=>e.id===M),n=Math.round(t.reported);return{from:`户部清吏司`,title:`为清丈旬报事`,summary:`各省续报丈量，合已丈过${n}分。`,body:`臣谨奏：清丈的旬报。\n\n各省续报，合已丈过${n}分。河南、山东两处报得快，陕西、云贵报得慢——山路难走，一县的册子要两个月才到府。\n\n臣不多说。只报一个数，请皇上心里有数。`,piaoni:`知道了。`,secret:`「知道了」三个字，是司礼监代批的。批了这两个字，这一旬就算过去了。`,yiEffect:{project:{id:M,progress:1.2,reported:3}},patience:6,ignoredEffect:{project:{id:M,progress:-.8,resistance:2},log:`清丈旬报压在案上。下一旬的报册，就不那么及时了。`},options:[{key:`yi`,label:`依拟`,effect:{project:{id:M,progress:1.2,reported:3}}},{key:`cui`,label:`催陕西、云贵两处`,needsReading:!0,note:`山路难走是真的。但你等不起`,effect:{project:{id:M,progress:2,reported:3.5,resistance:3},metrics:{minxin:-1},energy:-1,log:`严催陕云两省清丈。两省的报册，下月果然厚了些——至于实不实，另说。`}}]}},{weight:2,cooldown:9,requires:[`qz_open`],forbids:[`qingzhang_abandoned`]}),j(`qz-m30`,`personnel`,()=>({from:`襄王（藩府）`,title:`为恭进微仪、以备国用事`,summary:`襄王遣使赍黄金千两、缎二百匹入京，称「愿为朝廷效力」。`,body:`臣襄王谨启：臣闻朝廷清丈田亩，为国裕赋，此万世之利，臣不胜欣忭。

臣府中薄有蓄积，谨进黄金一千两、缎二百匹，以备国用。区区微仪，不敢称贡。

臣更有请者：臣府旧有庄田数处，皆祖宗所赐，册籍分明。清丈之日，乞敕有司照旧额存留，不必重丈，以全亲亲之谊。

臣不胜战栗待罪之至。`,piaoni:`藩王进献，于礼不宜受。其所请，着户部查旧例具奏。`,secret:`一千两黄金，换的是「不必重丈」四个字。这笔买卖他算得很清楚：藩府的庄田，隐占的何止十倍。`,yiEffect:{metrics:{chaoshi:1},project:{id:M,resistance:3},log:`襄王进献，依拟却之。其所请，户部查例。`},patience:4,ignoredEffect:{project:{id:M,resistance:6},log:`襄王的疏压在案上。别的王府看着，也都不说话了——他们在等这个头怎么开。`},options:[{key:`yi`,label:`依拟（却之）`,effect:{metrics:{chaoshi:1},project:{id:M,resistance:3},log:`却襄王进献。`}},{key:`shou`,label:`受其献，许其庄田免丈`,needsReading:!0,note:`一千两黄金。可这一开口，全天下的王府都会来要`,effect:{taicang:8,metrics:{guanfeng:-5,minxin:-3},project:{id:M,resistance:14,progress:-4},flags:{prifams_deal:1},energy:-1,log:`受襄王进献，许其庄田免丈。半月之内，另有六家王府上疏，所请如出一辙。`}},{key:`ji`,label:`却其献，并令先丈襄府`,needsReading:!0,note:`拿最大的开刀。一刀下去，要么立威，要么结仇`,effect:{project:{id:M,progress:5,resistance:12},metrics:{guanfeng:4,chaoshi:-4},flags:{prifams_anger:1},energy:-1,log:`却襄王献，令有司先丈襄府庄田。襄王闭门不出，宗人府递了话。`}}]}),{line:`qingzhang`,requires:[`qz_open`],cooldown:999,when:e=>(e.projects[0]?.progress??0)>=26&&!e.flags.qz_m30,sets:[`qz_m30`]}),j(`qz-m55`,`impeach`,()=>({from:`南直隶乡绅 联名`,title:`为清丈扰民、恳乞暂缓事`,summary:`苏松常镇四府乡绅二百余人联名呈控，言清丈胥吏索贿、拆户飞洒，民不堪命。`,body:`具呈南直隶苏州、松江、常州、镇江四府乡绅二百三十七人，为陈地方疾苦事。

朝廷清丈，本为均赋。然行之州县，胥吏辈借端勒索：有田一亩而丈作三亩者，有缴银三钱而免丈者，有以坟茔祠堂逼作耕田者。小民典衣鬻子，犹不能给。

更有甚者，本县之田，丈至邻县；甲户之税，摊入乙户。此非清丈，是乱政也。

生等世受国恩，不敢言乱。惟乞暂缓丈量，先将胥吏治罪，别遣廉明官覆核。

臣请就地附籍，设官管理。`,piaoni:`户部看议。`,secret:`这一点，成化年间就闹过一次，杀了十几万人。写这道疏的巡抚，案头就摆着那一次的旧档。`,yiEffect:{minxin:2},patience:3,ignoredEffect:{metrics:{minxin:-6,chaoshi:-4},log:`荆襄流民的事没人管。半年后，山中有聚众数千，掠州县仓。`},options:[{key:`yi`,label:`依拟（就地附籍）`,effect:{metrics:{minxin:6,chaoshi:2},taicang:-3,flags:{vagrant_ok:1},log:`许荆襄流民就地附籍，设郧阳巡抚领之。二十万人，从此有了籍。`}},{key:`qu`,label:`驱还本籍`,needsReading:!0,note:`把他们赶回去。成化年间就是这么办的`,effect:{metrics:{minxin:-8,chaoshi:-5},taicang:-2,flags:{vagrant_drive:1},energy:-1,log:`驱荆襄流民还籍。沿途死者甚众，山中有拒捕者，杀伤兵丁。`}},{key:`bian`,label:`编为军屯，就近守御`,needsReading:!0,note:`给地、给身份，还多一支兵`,effect:{metrics:{bianfang:4,minxin:3},taicang:-5,flags:{vagrant_army:1},energy:-1,log:`编荆襄流民为军屯，授田守御。得壮丁三万，屯田十二万亩。`}}]}),{weight:1,cooldown:22}),j(`armory`,`routine`,()=>({from:`工部`,title:`为军器朽坏、请旨修造事`,summary:`京营盔甲弓箭，十之六七朽坏不堪。请发银八万两修造。`,body:`臣谨奏：臣奉命查京营军器。

盔甲三千副，可用者九百。弓箭五万支，可用者一万二。火器二百门，炸过三门，剩下的不敢试。

臣问管库的，为什么烂成这样。他说：库里潮，十年没晒过。

臣请发银八万两修造。可臣也说一句：修好了没人管，还是要烂。`,piaoni:`工部知道。着动支节慎库银修造。`,secret:`「十年没晒过」是假话。真正的窟窿是每年领的修造银，都进了营官的口袋——这批军器报的是「已修」。`,yiEffect:{taicang:-6,metrics:{bianfang:1}},patience:6,ignoredEffect:{metrics:{bianfang:-3}},options:[{key:`yi`,label:`依拟`,effect:{taicang:-6,metrics:{bianfang:1}}},{key:`cha`,label:`先查历年修造银的去向`,needsReading:!0,note:`修一次烂一次，钱到哪去了`,effect:{taicang:5,metrics:{guanfeng:4,chaoshi:-2},energy:-1,log:`查京营修造银。查出营官冒领四万两，下狱二人。`}},{key:`xiu`,label:`发银十万，并定三年一晒的规矩`,needsReading:!0,note:`多花两万，买个不再烂`,effect:{taicang:-10,metrics:{bianfang:4,guanfeng:2},flags:{armory_fixed:1},energy:-1,log:`发银十万修造军器，定三年一晒之例。`}}]}),{weight:2,cooldown:14}),j(`recommend`,`personnel`,e=>{let t=e.officers.filter(e=>e.officeId===null),n=t[e.turn*7%Math.max(1,t.length)];return{from:`礼部尚书`,title:`为荐举贤才、以备任使事`,summary:`臣荐${n?.name??`某人`}，谓其才堪大用。伏乞擢用。`,body:`臣谨荐一人：${n?.name??`某人`}，${n?.origin??``}人，${n?.jinshi??``}。\n\n臣与他同乡，不敢说没有私心。可臣确实见过他办事。他在县里修过一条渠，三年没有水患；断过一桩拖了十年的田产案，两造都服。\n\n臣的考语是：${n?.appraisal??``}\n\n用不用，皇上自己看。臣只是把这个人摆在这儿。`,piaoni:`着吏部查议。`,secret:`${n?.name??`此人`}是这位尚书的门生。荐举的规矩，本来就是拿人情换位置——只是这一次，这个人也许真的可用。`,yiEffect:{metrics:{guanfeng:1}},patience:8,ignoredEffect:{metrics:{chaoshi:-1}},options:[{key:`yi`,label:`依拟（吏部查议）`,effect:{metrics:{guanfeng:1}}},{key:`yong`,label:`即召见${n?.name??`此人`}`,needsReading:!0,note:`见一面再定。这一面不花什么，但你会记住他`,effect:{energy:-2,flags:{[`met_${n?.id}`]:1},log:`召见${n?.name??`其人`}。问了半个时辰，问的是渠怎么修、案怎么断。`}},{key:`bo`,label:`驳回，且责其市恩`,needsReading:!0,note:`荐举就是结党。这么骂一句，以后没人敢荐人了`,effect:{metrics:{chaoshi:2,guanfeng:-3},flags:{recommend_stop:1},energy:-1,log:`驳回荐举，切责其市恩。此后半年，无人荐人。`}}]}},{weight:2,cooldown:13}),j(`auspice`,`routine`,()=>({from:`河南巡抚`,title:`为恭进嘉禾、以彰圣德事`,summary:`祥符县产嘉禾，一茎九穗。臣谨绘图进呈。`,body:`臣谨奏：祥符县民田内，产嘉禾一茎九穗，高二尺余。父老以为未有之瑞。

臣已命画工图之，谨呈御览。此皆皇上敬天勤民之所致也。

伏乞宣付史馆，以昭盛美。`,piaoni:`知道了。图留中。`,secret:`一茎九穗的禾，是县官从三株禾上绑起来的。这种事，每一朝都有，每一朝都有人信。`,yiEffect:{metrics:{chaoshi:1}},patience:8,options:[{key:`yi`,label:`依拟（留中）`,effect:{metrics:{chaoshi:1},log:`嘉禾图留中。`}},{key:`xuan`,label:`宣付史馆，赏进瑞者`,needsReading:!0,note:`祥瑞是政治。信不信是另一回事`,effect:{metrics:{chaoshi:3,minxin:2,guanfeng:-1},log:`嘉禾宣付史馆，赏巡抚银币。此后一月，各省进瑞者七起。`}},{key:`chi`,label:`斥其虚妄，戒各省勿进祥瑞`,needsReading:!0,note:`一句话堵死这条路。会有人不高兴`,effect:{metrics:{guanfeng:3,chaoshi:-2},flags:{no_auspice:1},energy:-1,log:`斥祥瑞虚妄，诏各省勿进。礼部侍郎面色不佳。`}}]}),{weight:1,cooldown:18})],N=(e,t)=>!!e.statutes[t],Kt=(e,t)=>!e.statutes[t],qt=j(`kc-abolished-pay`,`urgent`,e=>({from:`户部尚书`,title:`为逋欠骤增、国用告急事`,summary:`考成既罢，各省拖欠半年之内增至一百八十万。`,body:`臣谨奏：自《考成法》罢后，各省逋欠骤增。

上半年报部者，山东欠三十一万，河南欠二十七万，南直隶欠四十二万，合各省计之，已一百八十余万。去年这个时候，是七十六万。

臣细查其故：非百姓不纳，是州县不催。州县何以不催？从前完不成要降级，如今完不成只罚俸。罚俸一年，不过二十两。

臣不敢请复考成 —— 朝中正以「苛」字攻之。然太仓现在只余${Math.round(e.taicang)}万，九边的年例还欠着一半。这笔账，总要有人认。`,piaoni:`着户部严饬各抚按，照旧例催征。`,secret:`这道票拟是张四维拟的。他既要废考成，又要催征，两头都要占。「照旧例」三个字最妙——旧例就是没有考成的旧例。`,patience:3,yiEffect:{ledger:{taicang:12},metric:{chaoshi:-2}},ignoredEffect:{ledger:{taicang:-8},metric:{minxin:-3}},options:[{key:`restore`,label:`复考成，只宽一分`,note:`把「降三级」改为「降一级」，其余照旧`,effect:{ledger:{taicang:22},metric:{guanfeng:-4,chaoshi:-5,minxin:-2},flags:{kc_half_restored:1}}},{key:`borrow`,label:`向南京户部、太仆寺挪借`,note:`先过了今年，明年的账明年再说`,effect:{ledger:{taicang:26,taipu:-30},metric:{chaoshi:2}}}]}),{weight:0,cooldown:999,line:`st-kc`,when:e=>Kt(e,`kaocheng`)&&e.turn>=8,sets:[`kc_abolished_reported`]}),Jt=j(`ytb-jiangnan`,`urgent`,()=>({from:`应天巡抚`,title:`为江南赋重、民力不堪、乞赐酌议事`,summary:`一条鞭行于江南三月，苏松常镇四府士绅联名请缓。`,body:`臣谨奏：一条鞭法行于苏松常镇四府，三月于兹。

法本身是好的：赋役归并，计亩征银，胥吏不能飞洒，小民不受包揽之累。臣在任所见，里甲之弊，去其大半。

然有一事不能不奏：四府田赋甲于天下，一亩之入，不敷一亩之税。往时纳本色，尚可挪借；今改折银，秋成之日必须卖谷换银，谷贱银贵，一石只换得三钱。

今有华亭、上海、武进三县士绅联名具呈，乞将折银之数，每两减一钱。联名者二百四十七人，其中进士出身者三十一人。

臣不敢代为请，亦不敢壅于上闻。`,piaoni:`着户部查议。`,secret:`这二百四十七人里，有十九个是张四维的门生。他们不是替百姓请，是替自家的田请——折银折得越少，他们交得越少。`,patience:4,yiEffect:{ledger:{taicang:8},metric:{minxin:-3}},ignoredEffect:{metric:{minxin:-5,guanfeng:-2}},options:[{key:`cut`,label:`准减一钱，以示宽恤`,note:`江南人心得，太仓少收`,effect:{ledger:{taicang:-18},metric:{minxin:6,chaoshi:3},flags:{ytb_jiangnan_cut:1}}},{key:`hold`,label:`不许。法已立，不容再议`,note:`寸步不让，看谁先撑不住`,effect:{ledger:{taicang:10},metric:{chaoshi:-4,guanfeng:-2},flags:{ytb_jiangnan_hold:1}}}]}),{weight:0,cooldown:999,line:`st-ytb`,when:e=>N(e,`yitiaobian`)&&e.turn>=14}),Yt=j(`kh-pirate`,`urgent`,()=>({from:`福建巡抚`,title:`为海氛不靖、乞严守御事`,summary:`月港开关半载，商船日多，海寇亦混迹其中。`,body:`臣谨奏：月港开关以来，出海商船月增数十。关税所入，半年已得银二万三千两，是往年海禁时所无。

然有可虑者：商船既多，海寇亦混杂其中。真倭已少，多是漳泉之人，挟倭为名，聚众劫掠。前月南澳一役，官军追之，贼船反手就打，船比我们的快。

臣请于月港设水寨，募兵三千，岁需饷银六万。或者仍旧禁海，则此患自消 —— 只是那二万三千两的税，也没有了。`,piaoni:`着福建巡抚相机剿抚，兵部知道。`,secret:`这道票拟把「相机」两个字用得很好——相机就是没有定策。福建的兵，一半在卫所册子上，一半在将领的家丁里，真打起来不知道能调出多少人。`,patience:4,yiEffect:{metric:{bianfang:-2},ledger:{taicang:3}},ignoredEffect:{metric:{bianfang:-7,minxin:-4}},options:[{key:`navy`,label:`设水寨，募兵三千`,note:`岁费六万，海防才立得住`,effect:{ledger:{taicang:-30},metric:{bianfang:8},flags:{kh_navy:1}}},{key:`close`,label:`复禁海`,note:`一了百了，但税也没了`,effect:{statutes:{kaihai:!1},metric:{bianfang:4,minxin:-4,chaoshi:3}}}]}),{weight:0,cooldown:999,line:`st-kh`,when:e=>N(e,`kaihai`)&&e.turn>=20}),Xt=j(`kh-eunuch-tax`,`project`,()=>({from:`福建市舶太监 高寀`,title:`为市舶税务、乞归内监管理事`,summary:`市舶太监请将月港关税改由内监征收，径解内帑。`,body:`奴才谨奏：月港关税，现由福建布政司征收，解户部。

奴才在闽三年，见税关之弊：商船报关，胥吏索费，一船之税，入官者不过六成，余四成尽入私囊。此非独闽中，天下税关皆然。

奴才请将此项改归内监征收，岁解内帑。奴才不敢多取，只照旧额征足，则一年可多解银八千两 —— 这八千两，是胥吏吞掉的那些。

伏乞圣裁。`,piaoni:`着户部与福建抚按会议。`,secret:`他说「不敢多取」，可内监办税从没有只取旧额的。这八千两是饵，钓的是往后每年十几万。`,patience:5,yiEffect:{ledger:{taicang:4}},ignoredEffect:{},options:[{key:`give`,label:`准归内监`,note:`内帑多，户部少，外廷要闹`,effect:{ledger:{neitang:14,taicang:-10},metric:{guanfeng:-4,chaoshi:-3},flags:{tax_to_eunuch:1}}},{key:`keep`,label:`照旧归布政司`,note:`胥吏吞四成，但账在户部`,effect:{metric:{chaoshi:2},flags:{tax_to_eunuch:0}}}]}),{weight:0,cooldown:999,line:`st-kh2`,when:e=>N(e,`kaihai`)&&e.turn>=26}),P=j(`zl-prince`,`urgent`,()=>({from:`襄王（藩府）`,title:`为宗禄折色、王府用度不敷、乞赐矜悯事`,summary:`宗禄改折银后，襄王府岁入减三成，王上疏泣诉。`,body:`臣（襄王）谨奏：臣府岁支禄米二万一千石，自改折银之后，每石折银五钱，是岁得银一万零五百两。

往时本色，米价每石七钱，是臣府岁入实一万四千七百两；今折五钱，是每岁少了四千二百两。此四千二百两者，是臣府三百余口人的口粮、府中仪仗、祭祀、修缮之费。

臣不敢怨朝廷。然臣闻河南一省岁入二百八十万石，宗禄需二百四十万石 —— 朝廷亦有朝廷的难处。

臣只求一事：臣府禄米，仍支本色，其余各府照折。臣愿以身当这个不是。`,piaoni:`着宗人府、户部会议。`,secret:`襄王这一本写得极聪明：他不争「都别折」，只争「我除外」。若准了他，其余二十几个王府明天就都递本子。`,patience:3,yiEffect:{ledger:{taicang:5},metric:{chaoshi:-2}},ignoredEffect:{metric:{chaoshi:-6}},options:[{key:`exception`,label:`准襄府支本色`,note:`一个人开了口子，二十几个人跟着来`,effect:{ledger:{taicang:-10},metric:{chaoshi:3},flags:{zonglu_exception:1}}},{key:`refuse`,label:`不许。法一立，王与庶人同`,note:`硬顶，宗室要记恨`,effect:{metric:{chaoshi:-5,guanfeng:3},flags:{zonglu_refused:1}}}]}),{weight:0,cooldown:999,line:`st-zl`,when:e=>N(e,`zonglu`)&&e.turn>=16}),Zt=j(`ks-riot`,`urgent`,()=>({from:`湖广巡抚`,title:`为矿徒聚众、地方汹汹事`,summary:`内监开矿，掘及民田庐墓，武昌、汉阳聚众数千。`,body:`臣谨奏：内官监奉旨开矿，于武昌、汉阳二府掘矿三十七处。

初时尚可，所掘多在荒山。至五月，掘及民田，又掘及民坟 —— 江夏县民某氏祖坟被掘，棺已见，其族聚二百人持械相拒，内监随行之人伤者七。

今两府聚众已数千，有「逐矿使」之谣。臣调兵三百弹压，兵亦不肯前 —— 那些兵，也是本地人。

臣请暂罢矿税，以息众怒。若必开，乞先禁掘坟、禁占田。`,piaoni:`着内官监严饬，毋得扰民。`,secret:`这道票拟是司礼监代批的。陈矩写「严饬」二字时，笔尖顿了一下——他知道这两个字对矿使毫无约束。`,patience:2,yiEffect:{metric:{minxin:-3},ledger:{neitang:3}},ignoredEffect:{metric:{minxin:-12,chaoshi:-6},ledger:{neitang:5}},options:[{key:`stop`,label:`罢矿税`,note:`内帑断了一项进项，民心回来一些`,effect:{statutes:{kuangshui:!1},metric:{minxin:8,chaoshi:2},flags:{mine_stopped:1}}},{key:`restrict`,label:`只许掘荒山，禁及田墓`,note:`折中。矿使照旧有借口`,effect:{metric:{minxin:3},ledger:{neitang:-4},flags:{mine_restricted:1}}},{key:`suppress`,label:`调兵弹压，矿税照旧`,note:`压得下去。压下去之后呢`,effect:{metric:{minxin:-10,chaoshi:-4,guanfeng:-3},ledger:{neitang:8},flags:{mine_suppressed:1}}}]}),{weight:0,cooldown:999,line:`st-ks`,when:e=>N(e,`kuangshui`)&&e.turn>=24}),Qt=j(`tz-silence`,`routine`,()=>({from:`吏部尚书`,title:`为言路壅塞、科道缺员、乞赐简补事`,summary:`廷杖之后，六科给事中缺员过半，无人敢补。`,body:`臣谨奏：六科给事中额设五十八员，今在任者二十四员。

缺员之故，非无才可选 —— 是无人肯来。前月廷杖三人，一人死于杖下，二人削籍为民。科道之职，本是「言事」；今言事者死，谁还肯做这个官？

臣曾以三人名上，三人皆辞。内一人回书曰：「家有老母，不敢以身试杖。」

言路无人，则天下之弊，无人上闻。此非臣之私忧。`,piaoni:`着吏部另行拣选。`,secret:`这本是谁递的？——是司礼监让吏部递的。张诚想让皇上知道：杖打完，没人说话了，连坏事也没人报了。`,patience:5,yiEffect:{metric:{chaoshi:-2}},ignoredEffect:{metric:{chaoshi:-5,guanfeng:-3},backlog:6},options:[{key:`pardon`,label:`起复被杖诸臣`,note:`认个错。士林会记这一笔`,effect:{metric:{chaoshi:9,guanfeng:4},flags:{tz_pardoned:1}}},{key:`fill`,label:`另择温顺者补足`,note:`有人说话了，说的都是好话`,effect:{metric:{chaoshi:-3},backlog:-4,flags:{tz_filled:1}}}]}),{weight:0,cooldown:999,line:`st-tz`,when:e=>N(e,`tingzhang`)&&e.turn>=12}),$t=j(`open-ytb`,`routine`,()=>({from:`应天巡抚`,title:`为赋役繁杂、里甲赔累、乞行归并事`,summary:`南直隶一州县赋役名目三十余种，里甲赔累，请归并计亩征银。`,body:`臣谨奏：南直隶赋役之弊，至今而极。

一州县之内，赋有本色、折色、存留、起运；役有里甲、均徭、杂泛、驿传。名目三十余种，而小民所知者，只有「交多少」一句。

胥吏因缘为奸：飞洒者，以己之田分寄他人；诡寄者，以田寄于举人、生员名下；包揽者，代纳而倍取其息。里甲十年一轮，轮到的倾家；轮不到的，出银买免。

臣查苏州一府，额田九万顷，册上完粮者不过六万顷。其余三万顷，不在水，不在沙，在乡绅的「优免」两个字里。

若将一州县赋役，量地计丁，并为一条，概以银输官，则胥吏无所措手。此法江西、浙江已有行者，臣请于南直隶试行。

伏乞圣裁。`,piaoni:`着户部覆议，令抚按详具条目以闻。`,secret:`这本是应天巡抚自己写的，也是他自己想推的。推成之后，江南的钱粮从他手里过，说话的分量就不一样了。`,patience:5,yiEffect:{metric:{chaoshi:1}},options:[{key:`discuss`,label:`下部议，令抚按详具条目`,note:`把「一条鞭」三个字摆到朝上`,effect:{metric:{chaoshi:2},flags:{open_yitiaobian:1},log:`诏下部议一条鞭法。江南士绅闻之，多有异言。`}},{key:`slow`,label:`姑缓之，待清丈告竣再说`,note:`地亩还没核清，改赋役是白改`,effect:{metric:{chaoshi:-1},log:`一条鞭之议，暂缓。`}}]}),{weight:3,cooldown:55,when:e=>!N(e,`yitiaobian`)&&e.turn>=3,forbids:[`open_yitiaobian`]}),en=j(`open-kh`,`routine`,()=>({from:`福建巡抚`,title:`为海禁日久、私贩公行、乞开月港事`,summary:`海禁禁了二百年，禁出的是私贩，不是海船。请开月港，给引抽税。`,body:`臣谨奏：闽中海禁，行二百年矣。然海未尝一日无人。

漳州月港，私贩之船，岁不下三百。贩东西两洋，一船之利，可抵中人之产十家。禁之而不得禁，徒使奸民持官府之短，胥吏分其利。

前年海道副使捕得私贩二十七船，尽没人官。船主皆漳泉大姓，其族人现在朝中为官者，有四。捕而未办，拖至今。

臣请于月港开关：商民造船出海，官给引，抽其税。税入岁可得数万，而私贩之利，转在官。卫所不得擅拦，违者以枉法论。

此事关祖宗之法，臣不敢专，伏乞圣裁。`,piaoni:`着户部、兵部会议。`,secret:`福建的卫所军官，一半的进项来自「查私」——查一条船，收一份钱。开了关，这笔钱就断了。所以第一个反对开海的，不会是言官，是水寨里的把总。`,patience:4,yiEffect:{metric:{chaoshi:-1}},options:[{key:`open`,label:`着会议，许其开`,note:`祖宗之法，也要吃饭`,effect:{metric:{bianfang:-1,minxin:2},flags:{open_kaihai:1},log:`诏议开月港。福建水寨把总联名上书，言「海防自此坏矣」。`}},{key:`close`,label:`仍旧禁海，严拿私贩`,note:`守住祖制，也守住那三百条船的利`,effect:{metric:{bianfang:1,minxin:-2},log:`诏仍旧禁海。私贩如故。`}}]}),{weight:3,cooldown:55,when:e=>!N(e,`kaihai`)&&e.turn>=4,forbids:[`open_kaihai`]}),tn=j(`open-zl`,`routine`,()=>({from:`山西巡抚`,title:`为宗禄不给、岁支不敷、乞议折色事`,summary:`山西一省钱粮，宗禄占其大半；各王府禄米仍支本色，州县无以为继。`,body:`臣谨奏：山西一省钱粮，岁入二百八十万石，宗禄一项，需二百四十万石。

晋府、代府、沈府三王，岁支禄米各以万石计；郡王、将军、中尉以下，在册者三千余人，其支本色者，尚有一千二百。

臣到任三年，藩司库中，常不能给。前月代府以禄米不至，遣人至布政司坐索，吏不敢出。此事若传至京，臣不敢料其终。

今各王府禄米，若一律改折银两，每石折银五钱，则一岁所省，不下十万。然此非臣所敢议 —— 宗室之禄，是太祖高皇帝定的。

攻人者曰「大奸」，辩者曰「诬枉」；攻者再疏，辩者亦再疏。所论者，多非国事，而是彼此的门户。

臣为都御史，不能弹压。盖言官有言责，臣若抑之，是臣塞言路；臣若不抑，是臣纵其相攻。两难之中，谨以实闻。

伏乞圣裁。`,piaoni:`言官论事，自有其责。若以杖责之，恐塞忠谏之路。`,secret:`都御史这本，写得极小心。他不请用杖，只说「不敢不奏」——把刀递到你手上，日后若士林有怨，他可以说：臣只是奏闻。`,patience:4,yiEffect:{metric:{chaoshi:-1}},options:[{key:`ready`,label:`着锦衣卫备杖，以待旨`,note:`不必真打，让人知道午门有这根杖`,effect:{metric:{chaoshi:3,guanfeng:-2},flags:{open_tingzhang:1},log:`诏锦衣卫备杖午门。科道诸臣，一时都安静了不少。`}},{key:`calm`,label:`降旨戒谕，勿问其人`,note:`先讲道理，道理讲不通再说`,effect:{metric:{chaoshi:1,guanfeng:1},log:`降旨戒谕科道，令其各守职掌。`}}]}),{weight:3,cooldown:55,when:e=>!N(e,`tingzhang`)&&e.turn>=8&&(e.backlog>=10||e.truth.chaoshi<60),forbids:[`open_tingzhang`]}),an=j(`rep-kaocheng`,`routine`,e=>{let t=Math.round(e.flags.runs_kaocheng??0),n=Math.max(3,Math.round(t/2)),r=Math.round(t*.4);return{from:`吏部尚书`,title:`为考成岁报、分别举劾事`,summary:`考成行至今日，京官降黜${n}员，案牍清出${r}件。`,body:`臣谨奏：考成一法，行至今日，计${t}旬。\n\n本年京察、外察，以「征赋不足九成」降级者${n}员，其中知县十之七，推官十之二，同知以下十之一。\n\n各省逋欠，追解者已清${r}件。然臣有一言：降级的这些人里，有真怠惰的，也有真收不上来的。山东、河南连岁旱蝗，粮无从出；州县官不敢报灾，只敢报「未完」。\n\n臣请：凡灾伤之地，乞准展限；其余照旧考成。`,piaoni:`着吏部照例举行。`,secret:`吏部尚书这本，一半是替州县求情，一半是替自己表功 ——考成是他衙门里办的，降级的人越多，他的功劳越大，士林的怨也越深。`,patience:5,yiEffect:{metric:{chaoshi:1,guanfeng:-1}},options:[{key:`strict`,label:`不许展限。法一立，不容例外`,note:`考成之所以有用，就在不容例外`,effect:{ledger:{taicang:8},metric:{minxin:-4,guanfeng:2,chaoshi:-3}}},{key:`relief`,label:`灾伤之地，准其展限`,note:`少收一笔，少逼反一批`,effect:{ledger:{taicang:-4},metric:{minxin:5,chaoshi:2,guanfeng:-2}}}]}},{weight:1,cooldown:14,when:e=>N(e,`kaocheng`)&&(e.flags.runs_kaocheng??0)>=6}),on=j(`rep-ytb`,`routine`,e=>{let t=Math.round((e.flags.yield_yitiaobian??0)*10)/10,n=Math.round(e.flags.runs_yitiaobian??0);return{from:`户部尚书`,title:`为条鞭岁入、类报完欠事`,summary:`一条鞭行至今日，折银解到太仓共${Math.round(t)}万两。`,body:`臣谨奏：一条鞭法行于南直隶、浙江、江西诸处，计${n}旬。\n\n凡赋役归并、计亩征银者，共一百零七州县。折银解到太仓者，前后共${Math.round(t)}万两；较之旧额，岁增约${Math.max(1,Math.round(t/Math.max(1,n)*36))}万两。\n\n然臣不能不奏者三事：\n一、秋成卖谷换银，谷贱银贵，苏松常三府，每两多折一钱，民用苦之；\n二、里甲归并之后，胥吏无从包揽，改在「秤头」「火耗」上取；\n三、江北诸府，田瘠而赋重，折银之后，逃亡者渐多。\n\n法未尝不善，行之者不善耳。`,piaoni:`着户部查核，务使小民不受加耗之累。`,secret:`「火耗」两个字，是这本的关键。归并之弊去了，加耗之弊来了 —— 换一个名目，还是那一份钱。户部自己也抽这一份。`,patience:5,yiEffect:{ledger:{taicang:2},metric:{minxin:-1}},options:[{key:`chase`,label:`严追未完，火耗一并清查`,note:`钱要收到位，但州县又要敲一回`,effect:{ledger:{taicang:9},metric:{minxin:-5,guanfeng:2}}},{key:`cap`,label:`定火耗之数，不得多取`,note:`给州县留一条活路，也给自己留个名`,effect:{ledger:{taicang:-3},metric:{minxin:4,guanfeng:1,chaoshi:-1}}}]}},{weight:1,cooldown:14,when:e=>N(e,`yitiaobian`)&&(e.flags.runs_yitiaobian??0)>=6}),sn=j(`rep-kh`,`routine`,e=>{let t=Math.round((e.flags.yield_kaihai??0)*10)/10,n=Math.round(e.flags.runs_kaihai??0),r=Math.max(12,Math.round(n*6));return{from:`福建巡抚`,title:`为月港税课、类报船货事`,summary:`月港开关至今，商船${r}艘，关税解到${Math.round(t)}万两。`,body:`臣谨奏：月港开关，计${n}旬。\n\n出海商船，前后${r}艘，往吕宋、往暹罗、往日本者皆有。关税所入，解太仓者共${Math.round(t)}万两；另有市舶司存留，供本省水寨之用。\n\n有一事臣不敢不奏：商船既众，其中夹带者亦众。前月查得三船，舱底藏铁器、硝黄，问之，曰「往吕宋市磺」。此物出洋，回来就是倭人的炮。\n\n臣请于月港设盘验之法：出海验货，回港验船。然盘验需人，需饷，岁约六万两 —— 这笔钱，从关税里出，还是从太仓出？`,piaoni:`着福建抚按议奏。`,secret:`「往吕宋市磺」这一句，福建巡抚写了又划掉，划了又写上。他知道报上去会被人拿来做文章 —— 但他也知道，不报，日后出事是他的。`,patience:4,yiEffect:{ledger:{taicang:3}},options:[{key:`patrol`,label:`设盘验，岁费六万，从关税出`,note:`关税少解一点，海防稳一点`,effect:{metric:{bianfang:6,chaoshi:2},flags:{kh_patrol:1}}},{key:`loose`,label:`不必盘验，只照旧抽税`,note:`钱先收着，将来的事将来再说`,effect:{ledger:{taicang:6},metric:{bianfang:-3}}}]}},{weight:1,cooldown:14,when:e=>N(e,`kaihai`)&&(e.flags.runs_kaihai??0)>=6}),cn=j(`rep-zl`,`routine`,e=>{let t=Math.round((e.flags.yield_zonglu??0)*10)/10,n=Math.round(e.flags.runs_zonglu??0);return{from:`山西巡抚`,title:`为宗禄折色岁报、王府怨望事`,summary:`宗禄改折${n}旬，省下${Math.round(t)}万两；各王府怨言渐起。`,body:`臣谨奏：宗禄改折，行于山西、河南、湖广，计${n}旬。\n\n折色所省，解太仓者共${Math.round(t)}万两。藩司库中，自臣到任以来，第一次没有向户部告匮。\n\n然各王府怨望日深。晋王遣人至臣衙门，言「祖宗之法，非外臣所得议」；代府则以禄米不至，闭门不纳地方官。更有宗室数十人，聚于藩司门前，言「饿死也是死，不如死在布政司」。\n\n臣请：于折色之外，量为周恤 —— 贫宗无禄者，岁给米若干，庶几不至于生变。此项岁需不过二万两。`,piaoni:`着宗人府议奏。`,secret:`「饿死也是死」这句话，是宗室说的，也是山西巡抚想让你听见的。他知道这笔省下来的钱最后要落到哪里 —— 落不到贫宗身上。`,patience:4,yiEffect:{ledger:{taicang:2},metric:{chaoshi:-1}},options:[{key:`relief`,label:`准周恤贫宗，岁给二万`,note:`花小钱，压住一个可能炸的地方`,effect:{ledger:{taicang:-2},metric:{chaoshi:5,minxin:1},flags:{zl_relief:1}}},{key:`hard`,label:`不许。宗禄已定，哭穷者削其禄`,note:`硬到底。宗室会记很久`,effect:{metric:{chaoshi:-6,guanfeng:2},ledger:{taicang:4},flags:{zl_hard:1}}}]}},{weight:1,cooldown:14,when:e=>N(e,`zonglu`)&&(e.flags.runs_zonglu??0)>=6}),ln=j(`rep-ks`,`routine`,e=>{let t=Math.round((e.flags.yield_kuangshui??0)*10)/10,n=Math.round(t*1.2),r=Math.round(e.flags.runs_kuangshui??0);return{from:`内官监太监`,title:`为矿课解进、恭报数目事`,summary:`各省矿使解进内帑，前后共${n}万两。`,body:`奴才谨奏：矿税之行，计${r}旬。\n\n山西、陕西、河南、湖广、云南五省，设矿使二十七处，解进内帑者，前后共${n}万两。此皆不经户部，径解内库，账目清楚，可备查考。\n\n各省抚按，屡有奏称「矿使扰民」者。奴才不敢辩，只奏一事：所解之数，奴才一文未敢私留。若皇上不信，可遣人查库。\n\n再，湖广、江西矿脉渐薄，往后所入，恐不及此数。奴才预为奏闻。`,piaoni:`知道了。`,secret:`实解内帑的数是${t}万两。多出来的那一截，内官监说是「耗羡」，其实是各矿使按季孝敬的例规。你若不查，账永远是平的；你一查，账也是平的 —— 只是数字会变小。`,patience:3,yiEffect:{ledger:{neitang:3},metric:{minxin:-2,guanfeng:-1}},options:[{key:`audit`,label:`遣锦衣卫核库`,note:`查得出来，也得罪人`,effect:{ledger:{neitang:-6},metric:{guanfeng:3,minxin:3,chaoshi:-2},flags:{ks_audited:1}}},{key:`accept`,label:`知道了，照旧解进`,note:`账是平的，人心不是`,effect:{ledger:{neitang:5},metric:{guanfeng:-2,minxin:-3}}}]}},{weight:1,cooldown:14,when:e=>N(e,`kuangshui`)&&(e.flags.runs_kuangshui??0)>=6}),un=j(`rep-tz`,`routine`,e=>{let t=Math.round(e.flags.runs_tingzhang??0),n=Math.max(2,Math.round(t/4)),r=Math.min(34,8+Math.round(t/3));return{from:`都察院左都御史`,title:`为杖责人数、科道缺员事`,summary:`前后杖责${n}人，六科给事中缺员${r}员，言事者日少。`,body:`臣谨奏：廷杖之例行，前后杖责${n}人。\n\n六科给事中，额设五十八员，今在任者三十四员，缺员${r}员。都察院十三道御史，缺员亦半。\n\n缺员之故，臣不敢隐：非无才可选，是无敢来。前月吏部以六人名上，五人辞。内一人回书曰：「臣有老母在堂，不敢以一身试杖。」\n\n言路无人，则天下之弊，无人上闻。今日之患，不在言官太横，在言官太静。太静的时候，坏事就不出声了。`,piaoni:`着吏部另行拣选。`,secret:`都御史这本，是替言路求活。他自己也在怕 ——上一回杖责的名单，是司礼监拟的，他是看着名单才知道要打谁。`,patience:4,yiEffect:{metric:{chaoshi:-2}},options:[{key:`pardon`,label:`起复被杖诸臣，补足科道`,note:`认个错。士林会记这一笔`,effect:{metric:{chaoshi:8,guanfeng:4},backlog:-3,flags:{tz_restored:1}}},{key:`more`,label:`再杖二人，以正纲纪`,note:`压得更狠，静得更彻底`,effect:{metric:{chaoshi:-6,guanfeng:-3},backlog:-5}}]}},{weight:1,cooldown:14,when:e=>N(e,`tingzhang`)&&(e.flags.runs_tingzhang??0)>=6}),dn=[$t,en,tn,nn,rn],fn=[an,on,sn,cn,ln,un],F=(e,t)=>!!e.statutes[t],pn=[j(`open-yanfa`,`routine`,e=>({from:`两淮巡盐御史`,title:`为盐课壅积、边储不继、乞改纲运事`,summary:`两淮盐引壅积一百二十万道，商人不肯中；边镇粮储只够三个月。`,body:`臣谨奏：两淮盐课，是天下盐课之半。往年边镇缺粮，召商纳粟，官给盐引——商人运粮到边，领引支盐，官民两便。此谓「开中」。

近年以来，开中之法坏了：守边的将官，把盐引先截了，转卖给京里的势要；势要再转手，一引之利，官得三，私得七。商人算了账，运粮到边不如买引到扬州，于是边镇的粮仓，一年比一年空。

臣查：两淮盐引，壅积一百二十万道；边镇报来的粮储，宣大只够三个月，辽东只够两个月。太仓现存银${Math.round(e.taicang)}万，九边年例还欠着一半。\n\n臣请改行纲运：盐课由运司直接征银，解户部；商人在运司纳银领引，不再经边镇转手。如此，盐利归官，边储改由太仓发银采买。\n\n此举有两难：边镇从此不再有商人送粮，将官必以为断其命脉；而运司与纲商合流，未必不生出新的弊。臣不敢专，伏乞圣裁。`,piaoni:`着户部覆议，仍令边镇具奏有无妨碍。`,secret:`巡盐御史这本，一半是为国课，一半是为自己。纲运一改，盐政的权力从边镇回到运司，也就是回到他这一类人手里。`,patience:4,yiEffect:{ledger:{taicang:4},metric:{bianfang:-1}},options:[{key:`discuss`,label:`下部议，改纲运`,effect:{metric:{guanfeng:1},flags:{open_yanfa:1},log:`诏议盐法改纲运。边镇将官联名具奏，言「边储自此无着」。`}},{key:`hold`,label:`仍旧开中，只严查截引`,effect:{ledger:{taicang:3},metric:{bianfang:1},log:`盐法之议，暂缓。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`yanfa`)&&e.turn>=5,forbids:[`open_yanfa`]}),j(`open-caozhe`,`routine`,()=>({from:`户部尚书`,title:`为漕运耗费、运军赔累、乞议改折事`,summary:`漕粮四百万石北运，一路耗米三成；运军月粮，已欠了八个月。`,body:`臣谨奏：漕粮四百万石，自南而北，过淮、过闸、过洪，一石到京，脚费与耗米加起来，要三石之价。这是天下最贵的一条路。

运河这几年淤得快：高家堰一决，淮扬就断；闸河一浅，粮船就滞。去年漕船回空，迟了四个月，运军月粮欠了八个月，沿途卖船、卖儿的事都有。

臣查：若将江南漕粮一半改折银两，每石折银七钱，解太仓；京仓用银采买，商贩自会运来。省下的耗米与月粮，一岁可得二十万。

然此事有三难：一、京师米价必涨，小民先受其害；二、运军十二万，失了月粮，便是十二万闲人；三、漕运一系的官，从总督到闸官，全靠这条河吃饭。

臣不敢请全改，只请改一半，试行二年。伏乞圣裁。`,piaoni:`漕运乃国家命脉，改折一事，关系甚大。着九卿科道会议。`,secret:`这本是户部尚书自己写的。户部的账上，漕粮的耗米是一笔糊涂账 ——改了折，这笔账就归户部，他也就抓到了京仓采买的权。`,patience:4,yiEffect:{ledger:{taicang:5},metric:{minxin:-1}},options:[{key:`discuss`,label:`下部议，改折一半`,effect:{ledger:{taicang:6},metric:{minxin:-3,guanfeng:1},flags:{open_caozhe:1},log:`诏议漕粮改折。漕运总督上疏力争，言「祖宗之制不可变」。`}},{key:`hold`,label:`不许。漕运关系国本`,effect:{metric:{chaoshi:2},log:`漕折之议，不许。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`caozhe`)&&e.turn>=8,forbids:[`open_caozhe`]}),j(`open-haiyun`,`routine`,()=>({from:`工科都给事中`,title:`为运河淤塞、漕运不通、乞复海运事`,summary:`闸河浅涩，粮船滞留两月；元朝海运旧道尚在，请试之。`,body:`臣谨奏：今年漕船过淮，迟了两月。问其故，曰「闸河水浅，一日只行十里」。

运河自永乐年间开通，二百年了。河身淤高，堤岸单薄：北段靠泉，泉眼塞了；南段靠湖，湖水涨了就决堤。每年挑浅、修闸，费银几十万，只保得半年。

臣查前元旧制：漕粮自淮安出海，经登莱、成山，至天津入京。其路比运河近，其费比河运省。前朝行二百余年，本朝太祖、成祖时亦尝行之。

臣请：募沙船三百，自淮安出海，岁运二百万石；运河仍留一半，两路并行，试之三年。若海运有成，运河可专供转输，不必岁岁挑浅。

然海运之险，不可不奏：漂没之事，前朝多有。一船沉，数百人，此责在臣。伏乞圣裁。`,piaoni:`海运之议，前朝屡行屡罢。着户部、工部、漕运总督会议。`,secret:`这本是工科给事中写的，他管不了漕运，也没出过海。他真正想说的是：运河的账，工部看不下去。`,patience:4,yiEffect:{metric:{chaoshi:-1}},options:[{key:`discuss`,label:`着会议，试海运三年`,effect:{metric:{chaoshi:-2,bianfang:1},flags:{open_haiyun:1},log:`诏议海运。漕运总督与沿河州县，交章言其不便。`}},{key:`hold`,label:`不必。修河比试海稳当`,effect:{ledger:{taicang:-3},log:`海运之议，不许。挑浅的银子照旧花。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`haiyun`)&&e.turn>=14,forbids:[`open_haiyun`]}),j(`open-mazheng`,`routine`,e=>({from:`太仆寺卿`,title:`为马政困敝、民牧赔累、乞改折银事`,summary:`北直隶民牧马匹，一马之累，破一家之产；太仆寺库中，银却不多。`,body:`臣谨奏：太仆寺之政，本朝二百年来，以民牧为主：北直隶、山东、河南之民，按丁养马，免其徭役。此谓「民牧」。

民牧之苦，臣在外任时见过：一户养一马，马死则赔，马病则罚，种马孳生不及数，也要赔。一马之累，破一家之产；一家破，一甲逃。

而太仆寺的库中，其实存银不过${Math.round(e.taipu)}万 —— 这些年边饷不足，兵部动不动就来「借」。借了不还，账上还挂着。\n\n臣请改民牧为折银：每马折银十两，民户纳银，免其养马；太仆寺收银，边镇用马时发银采买。如此，民免赔累，寺中亦有余银。\n\n然有一节：边镇的马，是要能打仗的。银子买来的马，牙行说了算；买得急，价就十倍。臣不敢断其必善，伏乞圣裁。`,piaoni:`着兵部、太仆寺会议。`,secret:`太仆寺卿这本，说得很实在：他库里的银子被兵部借着不还，他想把「借」变成「征」——民牧改折之后，账就是太仆寺自己的账。`,patience:4,yiEffect:{ledger:{taipu:6},metric:{bianfang:-1}},options:[{key:`discuss`,label:`着会议，改民牧为折银`,effect:{ledger:{taipu:10},metric:{minxin:2,bianfang:-2},flags:{open_mazheng:1},log:`诏议马政改折。兵部言「边马自此难得」。`}},{key:`hold`,label:`仍旧民牧，只免种马赔补`,effect:{metric:{minxin:3},log:`马政之议，暂缓。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`mazheng`)&&e.turn>=6,forbids:[`open_mazheng`]}),j(`open-juanmian`,`routine`,()=>({from:`河南巡抚`,title:`为积欠如山、民逃过半、乞蠲旧逋事`,summary:`河南一省积欠二百四十万石，逃户十之三；追比之下，死者相望。`,body:`臣谨奏：河南自万历七年以来，连岁荒歉。一亩之收，不敷一亩之税；一县之民，逃者十之三。

积欠二百四十万石，其中六成是万历十年以前的旧账。州县按册追比，户已绝而册未除，则责之里甲；里甲不能支，则责之里长。前月杞县一里长，追比不过，自缢于县门。

臣请：万历十年以前逋欠，一概蠲免；十年以后，許分三年带征。如此，册上少一笔死账，民间多一条活路。

然户部必不肯：这笔账他们记了十年，一蠲，账面上就是亏空。臣不敢请，只敢奏。伏乞圣裁。`,piaoni:`积欠一事，屡经言官奏请。着户部查议，果系灾伤，准其蠲免。`,secret:`河南巡抚这本，一半是替百姓，一半是替自己：他今年考满，如果逋欠还在册上，他就是「征赋不足」的那一个。`,patience:3,yiEffect:{ledger:{taicang:-5},metric:{minxin:3}},options:[{key:`pardon`,label:`蠲万历十年以前逋欠`,effect:{metric:{minxin:8,guanfeng:1},flags:{open_juanmian:1},log:`诏蠲各省旧逋。户部具奏，言「国用将绌」。`}},{key:`chase`,label:`不许。只准分年带征`,effect:{ledger:{taicang:8},metric:{minxin:-6},log:`诏不许蠲免，只许分年带征。河南又逃了一批。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`juanmian`)&&e.turn>=7&&e.truth.minxin<58,forbids:[`open_juanmian`]}),j(`open-jiapai`,`routine`,e=>({from:`户部尚书`,title:`为帑藏空虚、边饷无措、乞暂加田赋事`,summary:`太仓只剩${Math.round(e.taicang)}万，下月九边年例无处取。臣请每亩暂加三厘。`,body:`臣谨奏：太仓现存银${Math.round(e.taicang)}万。下月应发九边年例十一万，百官俸禄二万，太仆寺借支的旧账还没清。臣算过，到这个月底，库里剩不下三万。\n\n臣不敢请动内帑 —— 内帑是皇上的私房，臣无此理。臣也不敢再借太仆，那个窟窿已经借了二十年。\n\n臣请：天下田亩，每亩暂加银三厘，名曰「边饷预征」。天下田约七百万顷，每亩三厘，一岁可得银二十余万。加派三年，边饷可支。\n\n臣知道这两个字不好看。万历初年张太师在日，最恨的就是加派；他说「加派一开，十年收不回去」。臣也这么想。可是下个月的饷，总得有个出处。伏乞圣裁。`,piaoni:`加派之事，关系民心。着九卿会议，不许轻议。`,secret:`这本是户部尚书递的，也是被逼的：九边欠饷，兵部一天三道咨文来催，催到后来，连他衙门的书办都被骂哭了。`,patience:3,yiEffect:{ledger:{taicang:8}},options:[{key:`levy`,label:`准加三厘，三年为限`,effect:{ledger:{taicang:18},metric:{minxin:-8,chaoshi:-2},flags:{open_jiapai:1},log:`诏亩加三厘。科道交章论劾，言「此亡国之政」。`}},{key:`no`,label:`不许。另议节用`,effect:{ledger:{taicang:-6},metric:{minxin:4,chaoshi:2},log:`诏不许加派。户部与兵部，在文华门外吵了一架。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`jiapai`)&&e.turn>=10&&e.taicang<120,forbids:[`open_jiapai`]}),j(`open-rongyuan`,`routine`,()=>({from:`吏部尚书`,title:`为官冗役滥、俸禄不支、乞行裁革事`,summary:`两京添设官三百余员，各省佐贰闲住者以千计；俸禄却一文不能少。`,body:`臣谨奏：两京各衙门，额设之外，添设者三百余员；各省佐贰、首领官，闲住无差者，以千计。此辈不干事，却要吃俸。

臣查户部账：一岁俸禄，京官二十四万，外官三十六万。若去其三之一，岁可省银二十万 —— 这二十万，正好是九边一个月的年例。

然裁革有三难：一、添设之官，多是阁臣、部院堂官荐的，裁一个，得罪一个；二、各省佐贰，多是举人、监生出身，无他生计，裁了就要闹；三、考成法正在行，州县缺人，裁了更办不动。

臣请：先裁两京添设官，各省佐贰暂留；一年之后，再看成效。宁可慢，不可乱。伏乞圣裁。`,piaoni:`裁革冗员，前朝有行之者，然未几而复。着吏部详议。`,secret:`吏部尚书这本，写得像替朝廷省钱，其实是替自己立威：裁谁不裁谁，名单从他手里过。`,patience:4,yiEffect:{ledger:{taicang:3},metric:{chaoshi:-1}},options:[{key:`discuss`,label:`下部议，先裁两京添设官`,effect:{ledger:{taicang:4},metric:{guanfeng:2,chaoshi:-2},flags:{open_rongyuan:1},log:`诏议裁革冗员。被裁者数十人，聚于吏部门前。`}},{key:`hold`,label:`不必。人多好办事`,effect:{metric:{chaoshi:1},log:`汰冗之议，不许。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`rongyuan`)&&e.turn>=7,forbids:[`open_rongyuan`]}),j(`open-caiyi`,`routine`,()=>({from:`兵部尚书`,title:`为驿递困敝、夫马逃亡、乞行裁并事`,summary:`天下驿站一千余处，岁费银三百万；勘合滥发，白吃白住者无数。`,body:`臣谨奏：天下驿站一千零五十处，岁费银三百万两 —— 这个数，是太仓岁入的四分之三。

驿站之弊，不在驿而在「勘合」：一张勘合，可以支夫十名、马五匹、廪给三份。京官出京，勘合是吏部给的；外官入京，勘合是兵部给的；还有一种是「飞票」，乡宦、生员、举人都有办法弄到手。

臣查万历五年，各省勘合发了一万二千张；额定不过三千。多出来的九千张，每张支银三两，就是二万七千两 —— 这还只是明账。

臣请：裁并驿站十之三，核减夫马；凡无勘合而支应者，以枉法论。省下来的银，解户部。

然驿卒数万，失了差事，便是数万闲人。此事臣不敢不奏。伏乞圣裁。`,piaoni:`驿递之弊，言者屡矣。着兵部会同户部会议。`,secret:`兵部尚书这本，算得很精：驿递省下的钱，他说解户部，其实兵部想留一半养马。`,patience:4,yiEffect:{ledger:{taicang:2},metric:{minxin:-1}},options:[{key:`discuss`,label:`下部议，裁并十之三`,effect:{ledger:{taicang:3},metric:{guanfeng:1,minxin:-2},flags:{open_caiyi:1},log:`诏议裁驿。各省驿卒，聚于按察司门前。`}},{key:`hold`,label:`不必。驿递一通，天下才通`,effect:{metric:{chaoshi:1},log:`裁驿之议，不许。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`caiyi`)&&e.turn>=9,forbids:[`open_caiyi`]}),j(`open-qingjun`,`routine`,()=>({from:`兵部尚书`,title:`为卫所空额、兵册虚冒、乞行清军事`,summary:`辽东额兵八万，实额不足六万；空额之饷，尽入将官私囊。`,body:`臣谨奏：卫所之兵，本朝以军户世袭。军户逃亡，则勾其原籍之丁补伍，此谓「清军」。二百年下来，军户逃的逃、绝的绝，册上的人，早就不是地上的。

臣查辽东：额兵八万，实额不足六万。空出来的两万人，饷银照领 ——这一笔，各级将官分。臣不敢说分得多少，只知道辽东的总兵，去年在京师买了两处宅子。

臣请：遣御史分赴各省清军，凡逃亡者，勾其户丁补伍；冒名顶替者，革。一年一造册，送兵部备查。

然清军之法，最难在「勾军」：一户逃了，勾其族人；族人逃了，勾其里甲。一纸军帖下去，能勾散一个村。此事臣不敢不言。伏乞圣裁。`,piaoni:`清军一事，屡行屡止。着兵部会同都察院议奏。`,secret:`兵部尚书这本，说的都是实话；他真正想要的，是把空额的账拿到自己手里 ——清军一办，兵部的册子才是唯一的册子。`,patience:4,yiEffect:{metric:{bianfang:2,minxin:-1}},options:[{key:`discuss`,label:`下部议，遣御史清军`,effect:{metric:{bianfang:3,minxin:-2,guanfeng:1},flags:{open_qingjun:1},log:`诏遣御史清军。各省勾军之帖，一日发出三百。`}},{key:`hold`,label:`不必。清一次，乱一次`,effect:{metric:{minxin:2},log:`清军之议，不许。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`qingjun`)&&e.turn>=10,forbids:[`open_qingjun`]}),j(`open-shangtun`,`routine`,()=>({from:`宣大总督`,title:`为边地荒芜、储峙不足、乞召商屯种事`,summary:`宣府、大同关外荒地千里；请召商开垦，给引免科。`,body:`臣谨奏：宣府、大同关外，荒地千里。国初设卫屯田，军士自种自食；如今屯田尽废，军士的粮，全靠太仓发银来买。

臣尝出关巡视：土是好的，水也够，只是没人种。为什么没人种？一、种了要被虏骑抢；二、种了要交科；三、种了之后，卫所说来收「屯田旧额」。

臣请：召商开种。凡商人在边地开荒者，给盐引，免三年科；三年之后，按亩起科，仍比内地轻。如此，边地有粮，商有引，官府不必岁岁千里转输。

然商人屯田，必有家丁、有堡寨，久而久之，边地就有了不服管的私兵。此事关系甚大，臣不敢专，伏乞圣裁。`,piaoni:`着户部、兵部会议。`,secret:`宣大总督这本，写得很坦白：他要的不是粮，是边地的「商」——有商就有税，有税就有他可以支配的钱。`,patience:4,yiEffect:{ledger:{taicang:2},metric:{bianfang:2}},options:[{key:`discuss`,label:`着会议，召商屯种`,effect:{metric:{bianfang:3,minxin:-1},flags:{open_shangtun:1},log:`诏议商屯。户部言「盐引有限，商屯夺之」。`}},{key:`hold`,label:`不必。边地之事，宁简毋繁`,effect:{metric:{chaoshi:1},log:`商屯之议，不许。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`shangtun`)&&e.turn>=8,forbids:[`open_shangtun`]}),j(`open-jingying`,`routine`,()=>({from:`京营提督`,title:`为京营疲敝、军户逃亡、乞改募兵事`,summary:`京营额兵十二万，实能披甲者不足三万；请改募兵，厚给粮饷。`,body:`臣谨奏：京营额兵十二万，臣点过两回：第一回实到五万，第二回实到三万七千。来的人里，能披甲、能开弓的，不到一半。

问其故：军户是世袭的，父死子替；替不上，就雇人应点 —— 一人一旬银一钱。点过之后，各回各家做买卖。这样的兵，守城门尚可，打仗是不行的。

臣请改募兵：选民间壮丁，月给银一两五钱，另给冬衣；选锋三千，专习火器。卫所军户，渐次改募，不愿者听。

然募兵最贵：一岁之饷，比军户多三倍。户部必不肯，兵部也未必肯 ——募兵是提督的兵，不是尚书的兵。此事臣不敢专，伏乞圣裁。`,piaoni:`京营积弊已久。募兵之议，着户部、兵部会议，务求可行。`,secret:`京营提督这本，话里有话：募来的兵，饷由他发，将由他选 ——十二万人的京营如果变成三万募兵，这三万人是谁的兵？`,patience:4,yiEffect:{metric:{bianfang:2},ledger:{taicang:-3}},options:[{key:`discuss`,label:`下部议，改募兵`,effect:{metric:{bianfang:4,guanfeng:1},ledger:{taicang:-8},flags:{open_jingying:1},log:`诏议京营募兵。户部尚书奏：「饷从何出？」`}},{key:`hold`,label:`不许。京营照旧点卯`,effect:{ledger:{taicang:3},log:`募兵之议，不许。京营照旧点卯。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`jingying`)&&e.turn>=10,forbids:[`open_jingying`]}),j(`open-neicao`,`routine`,()=>({from:`司礼监掌印太监`,title:`为京营不可恃、乞简内臣习武以备非常事`,summary:`奴才请简选内臣三千，习弓马火器于内教场，以备宿卫。`,body:`奴才谨奏：京营的兵，奴才不敢说。前月点卯，十二万的册子，来的不到四万。

奴才想着：宫城宿卫，是奴才们的差事。万一有变，靠谁？请简选内臣年少有力者三千，于内教场习弓马、习火器，另选二百人习刀盾。此辈吃的是皇上的饭，认的是皇上的人。

奴才不敢说这是「兵」。只是宫里得有些能动手的人。

然外廷若知，必以为内臣典兵之始，必有一番话说。奴才不敢瞒，伏乞圣裁。`,piaoni:`内臣习武，祖宗朝未有此例。此事关系甚大，请旨裁夺。`,secret:`这本是司礼监递的。内操一开，宫里的刀就在他们手里 ——「以备非常」四个字，非常的是谁，他们没写。`,patience:3,yiEffect:{metric:{chaoshi:-2,guanfeng:-1}},options:[{key:`allow`,label:`准内操，简选三千`,effect:{metric:{bianfang:2,chaoshi:-4,guanfeng:-2},flags:{open_neicao:1},log:`诏准内操。外廷闻之，六科连章，言「阉寺典兵，非国家之福」。`}},{key:`deny`,label:`不许。宿卫自有京营`,effect:{metric:{chaoshi:3},log:`内操之议，不许。司礼监叩首而退。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`neicao`)&&e.turn>=12,forbids:[`open_neicao`]}),j(`open-jiangxue`,`routine`,()=>({from:`礼部右侍郎`,title:`为书院久废、士习日偷、乞弛讲学之禁事`,summary:`天下书院，自万历七年禁毁，士人无讲习之所；请弛其禁。`,body:`臣谨奏：书院之禁，起于万历七年。当时以「聚徒空谈、摇撼朝政」为罪，毁天下书院六十四处。至今四年，书院是毁了，士习却没有变好。

臣在礼部，看得见两件事：一、士子无讲习之所，只读程文，学问日陋；二、书院虽毁，讲学的人还在，改在寺庙、在私宅，反而更不受管。

臣请：弛讲学之禁。各省书院，许其复设；讲学不必先报有司。但有聚众干政、诽谤朝政者，仍以律论 —— 禁的是干政，不是讲学。

然讲学之风一开，士论必盛；士论盛，则朝廷的是非，就有人说三道四。此事臣不敢专，伏乞圣裁。`,piaoni:`讲学一事，前有明旨禁之。着礼部再议。`,secret:`礼部右侍郎是翰林出身。他这本，是替自己的同年、门生说话 ——书院一开，讲学的那些人，多是他的师友。`,patience:4,yiEffect:{metric:{guanfeng:1}},options:[{key:`open`,label:`弛禁，许复书院`,effect:{metric:{guanfeng:2,minxin:1,chaoshi:-2},flags:{open_jiangxue:1},log:`诏弛讲学之禁。各省书院，次第复设。`}},{key:`keep`,label:`仍旧禁之`,effect:{metric:{chaoshi:2,guanfeng:-1},log:`讲学之禁，仍旧。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`jiangxue`)&&e.turn>=9,forbids:[`open_jiangxue`]}),j(`open-jinjiangxue`,`routine`,()=>({from:`内阁首辅`,title:`为士风嚣竞、聚徒非议事，乞申讲学之禁事`,summary:`各省私设书院，聚徒数百，议论朝政；请申严禁，拆毁如故。`,body:`臣谨奏：书院之禁，行了四年，禁而不绝。各省仍有私设者：或托名「社学」，或称「讲会」，聚徒数百，旬日一会。

臣不是怕他们讲学。臣是怕他们讲完了，把讲的话写成书，刻出来卖；书一出来，天下的士子都读了，读完了就以为朝政该这么办 ——而他们连一个县的赋税都收不上来。

臣请：申明旧禁。凡私设书院者，拆毁；聚徒讲学者，以违制论；刻书售卖者，追板销毁。有司岁终具报。

臣知道这会招骂。但是非出于士口，政令就没有一天能行得通。伏乞圣裁。`,piaoni:`着礼部、都察院申明旧例。`,secret:`首辅这本，其实是替自己：书院里骂得最凶的，正是他当年得罪过的那几个人。`,patience:4,yiEffect:{metric:{chaoshi:1,guanfeng:-1}},options:[{key:`ban`,label:`申禁，拆毁私设书院`,effect:{metric:{chaoshi:3,guanfeng:-2,minxin:-1},flags:{open_jinjiangxue:1},log:`诏申讲学之禁。各省拆毁书院十一处，士林大哗。`}},{key:`relax`,label:`不必。让他们说去`,effect:{metric:{guanfeng:1},log:`申禁之议，不许。`}}]}),{weight:2,cooldown:55,when:e=>!F(e,`jinjiangxue`)&&e.turn>=9,forbids:[`open_jinjiangxue`]}),j(`open-xianfeng`,`routine`,()=>({from:`礼部尚书`,title:`为宗藩日繁、禄米不继、乞议限封事`,summary:`在册宗室逾十万，岁支禄米八百五十万石；请自郡王以下减等承袭。`,body:`臣谨奏：太祖高皇帝封建诸王，本意是屏藩皇室。二百年下来，宗室在册者逾十万：亲王三十，郡王二百余，将军、中尉以下，不可胜数。

岁支禄米八百五十万石。天下税粮，不过二千六百万石 —— 三分之一，养宗室。山西、河南两省，存留粮不够宗禄，年年要向户部请拨。

臣请：自郡王以下，不世袭罔替。亲王之子封郡王，郡王之子降封镇国将军，以次递降；禄米随爵递减。如此，三代之后，宗禄可减其半。
